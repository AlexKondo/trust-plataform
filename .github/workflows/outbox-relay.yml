name: Outbox Relay (scheduled drain)

# Migração Render → Vercel (2026-09-17): a API não roda mais como processo
# residente, então não há setInterval publicando eventos do outbox. Este
# workflow substitui esse papel chamando o endpoint interno de drain a cada
# 5 minutos.
#
# Segredos necessários em Settings → Secrets and variables → Actions:
#   - INTERNAL_JOB_SECRET : mesmo valor configurado na Vercel (env var
#                           INTERNAL_JOB_SECRET do projeto apps/api).
#   - API_BASE_URL        : URL pública da API na Vercel, ex.:
#                           https://trust-api.vercel.app (sem barra final).
# Ambos devem ser cadastrados como Repository secrets (não Variables, mesmo
# API_BASE_URL não sendo sensível — simplicidade de configuração).

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

jobs:
  drain:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger outbox relay drain
        run: |
          status=$(curl -sS -o /tmp/response.json -w '%{http_code}' \
            -X POST "${API_BASE_URL}/api/v1/internal/jobs/outbox-relay" \
            -H "x-internal-job-secret: ${INTERNAL_JOB_SECRET}" \
            -H "content-type: application/json")
          echo "HTTP status: $status"
          cat /tmp/response.json
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "Outbox relay drain failed with status $status"
            exit 1
          fi
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          INTERNAL_JOB_SECRET: ${{ secrets.INTERNAL_JOB_SECRET }}
