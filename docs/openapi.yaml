openapi: 3.1.0
info:
  title: Trust Platform API
  version: 0.2.0
  description: >
    API do MVP da Trust Platform (monolito modular: IDN, TPS, VRF, TRS, MRK).
    Todas as respostas usam o envelope {success, data} / {success:false, error:{code,message}}
    (DOC-003). Datas em UTC ISO 8601. Atualizada a cada feature — mudança de contrato
    exige atualizar este documento antes da implementação.
servers:
  - url: http://localhost:3001/api/v1
    description: Desenvolvimento local
tags:
  - name: Platform
  - name: Identity
  - name: Auth
  - name: Trust Passport
  - name: Verification
  - name: Trust Score
  - name: Marketplace

paths:
  /health:
    get:
      tags: [Platform]
      summary: Health check (público)
      operationId: getHealth
      security: []
      responses:
        '200':
          description: Status da aplicação e do banco
          content:
            application/json:
              example:
                success: true
                data:
                  status: UP
                  database: UP
                  timestamp: '2026-08-08T21:00:00.000Z'

  /identities:
    post:
      tags: [Identity]
      summary: IDN-001 — Create Identity (cadastro, público)
      operationId: createIdentity
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fullName, email, password, confirmPassword, acceptTerms]
              properties:
                fullName:
                  type: string
                  minLength: 3
                  maxLength: 150
                  example: John Doe
                email:
                  type: string
                  format: email
                  maxLength: 255
                  example: john@email.com
                password:
                  type: string
                  minLength: 12
                  description: >
                    Mínimo 12 caracteres (DOC-002), com maiúscula, minúscula, número e
                    caractere especial; não pode conter o nome nem o e-mail do usuário.
                  example: 'Password@1234'
                confirmPassword:
                  type: string
                  description: Deve ser idêntica a password.
                acceptTerms:
                  type: boolean
                  description: Deve ser true (BR-005).
      responses:
        '201':
          description: Identity criada com status PENDING_EMAIL_VERIFICATION
          content:
            application/json:
              example:
                success: true
                data:
                  identityId: '019fe415-6318-7bfb-a184-3f47c3f0b7e1'
                  status: PENDING_EMAIL_VERIFICATION
        '400':
          description: Validação sintática/política de senha (VALIDATION_ERROR, com details)
          content:
            application/json:
              example:
                success: false
                error:
                  code: VALIDATION_ERROR
                  message: Request validation failed.
                  details:
                    - path: password
                      message: password must have at least 12 characters
        '409':
          description: E-mail já cadastrado (BR-001/006)
          content:
            application/json:
              example:
                success: false
                error:
                  code: EMAIL_ALREADY_EXISTS
                  message: An identity with this email already exists.

  /identities/me:
    get:
      tags: [Identity]
      summary: IDN-005 — Dados da Identity autenticada
      description: >
        Rota da spec era `/me`; padronizada como `/identities/me` (mesmo padrão de
        `/trust-passports/me` do TPS-002). Retorna apenas dados públicos.
      operationId: getCurrentIdentity
      responses:
        '200':
          description: Dados da Identity autenticada
          content:
            application/json:
              example:
                success: true
                data:
                  identityId: '019fe415-6318-7bfb-a184-3f47c3f0b7e1'
                  fullName: John Doe
                  email: john@email.com
                  status: ACTIVE
                  createdAt: '2026-08-08T10:00:00.000Z'
                  lastLoginAt: '2026-08-08T20:30:00.000Z'
                  isAdmin: false
        '401':
          description: Sem token ou token inválido/expirado (INVALID_TOKEN)
        '403':
          description: Identity não está ativa (IDENTITY_NOT_ACTIVE)
        '404':
          description: Identity não encontrada (IDENTITY_NOT_FOUND)

  /auth/logout:
    post:
      tags: [Auth]
      summary: IDN-006 — Encerrar a sessão atual
      description: >
        Revoga apenas a sessão do access token usado na chamada; outras sessões
        do usuário permanecem ativas. O refresh token da sessão morre imediatamente;
        o access token permanece válido até expirar (≤15 min — P7, sem blocklist no MVP).
      operationId: logout
      responses:
        '204':
          description: Sessão revogada; sem corpo
        '401':
          description: Sem token válido (INVALID_TOKEN) ou sessão já revogada (SESSION_ALREADY_REVOKED)
        '404':
          description: Sessão não encontrada (SESSION_NOT_FOUND)

  /identities/verify-email:
    get:
      tags: [Identity]
      summary: IDN-002 — Confirmar e-mail via token do link (público)
      operationId: verifyEmail
      security: []
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
            minLength: 20
            maxLength: 255
          description: Token recebido no e-mail de verificação (validade de 24 h).
      responses:
        '200':
          description: E-mail confirmado; conta ativada
          content:
            application/json:
              example:
                success: true
                data:
                  status: ACTIVE
        '400':
          description: Token inválido ou expirado (INVALID_VERIFICATION_TOKEN / EXPIRED_VERIFICATION_TOKEN)
          content:
            application/json:
              example:
                success: false
                error:
                  code: INVALID_VERIFICATION_TOKEN
                  message: Invalid verification token.
        '404':
          description: Identity não encontrada (IDENTITY_NOT_FOUND)
        '409':
          description: E-mail já verificado (EMAIL_ALREADY_VERIFIED)

  /identities/{identityId}/verify-email:
    post:
      tags: [Identity]
      summary: IDN-002 — Reenviar e-mail de verificação (público)
      operationId: resendEmailVerification
      security: []
      parameters:
        - name: identityId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '202':
          description: Novo token gerado e e-mail solicitado; tokens anteriores invalidados
          content:
            application/json:
              example:
                success: true
                data: null
        '404':
          description: Identity não encontrada (IDENTITY_NOT_FOUND)
        '409':
          description: E-mail já verificado (EMAIL_ALREADY_VERIFIED)

  /auth/login:
    post:
      tags: [Auth]
      summary: IDN-003 — Login com e-mail e senha (público)
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: Autenticado; access token ES256 (15 min) + refresh token opaco (30 dias, rotação no refresh)
          content:
            application/json:
              example:
                success: true
                data:
                  accessToken: 'eyJhbGciOiJFUzI1NiIs…'
                  refreshToken: 'gxqi_Qxn7CtKd560gtE7jZ…'
                  expiresIn: 900
        '400':
          description: Request malformado (VALIDATION_ERROR)
        '401':
          description: Credenciais inválidas — mensagem opaca, igual para e-mail inexistente e senha errada (INVALID_CREDENTIALS)
        '403':
          description: Conta não ativada — e-mail ainda não verificado (IDENTITY_NOT_ACTIVE)
        '429':
          description: Conta temporariamente bloqueada por tentativas falhas (ACCOUNT_LOCKED) ou rate limit por IP (RATE_LIMIT_EXCEEDED)

  /auth/refresh:
    post:
      tags: [Auth]
      summary: IDN-004 — Renovar sessão com rotação do refresh token (público)
      operationId: refreshSession
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
                  description: Refresh token recebido no login ou no refresh anterior. Uso único — cada renovação devolve um novo.
      responses:
        '200':
          description: Novos tokens; o refresh token anterior deixa de valer imediatamente
          content:
            application/json:
              example:
                success: true
                data:
                  accessToken: 'eyJhbGciOiJFUzI1NiIs…'
                  refreshToken: 'nZhNpAkFVk_ck58xHC56…'
                  expiresIn: 900
        '401':
          description: Token desconhecido/já usado (INVALID_REFRESH_TOKEN), expirado (EXPIRED_REFRESH_TOKEN) ou sessão revogada (SESSION_REVOKED)
        '403':
          description: Identity não está mais ativa (IDENTITY_NOT_ACTIVE)

  /auth/forgot-password:
    post:
      tags: [Auth]
      summary: IDN-007 — Solicitar recuperação de senha (público; anti-enumeração)
      operationId: forgotPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '202':
          description: Resposta SEMPRE idêntica, exista ou não a conta. Token de reset vale 30 min; só o mais recente é válido.
          content:
            application/json:
              example:
                success: true
                data:
                  message: If an account exists for this email, password recovery instructions have been sent.

  /auth/reset-password:
    post:
      tags: [Auth]
      summary: IDN-008 — Redefinir senha com token de recuperação (público)
      description: Ao concluir, TODAS as sessões e refresh tokens são revogados — novo login obrigatório.
      operationId: resetPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, newPassword]
              properties:
                token:
                  type: string
                newPassword:
                  type: string
                  minLength: 12
                  description: Política DOC-002 (12+ chars, maiúscula, minúscula, número, especial).
      responses:
        '204':
          description: Senha redefinida; sessões revogadas
        '400':
          description: Senha fora da política (VALIDATION_ERROR)
        '401':
          description: Token inválido/já usado (INVALID_RESET_TOKEN) ou expirado (EXPIRED_RESET_TOKEN)

  /auth/change-password:
    post:
      tags: [Auth]
      summary: IDN-009 — Alterar senha (autenticado)
      description: Revoga todas as demais sessões; a sessão usada na chamada permanece ativa (INCONSISTENCIAS #22).
      operationId: changePassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword:
                  type: string
                newPassword:
                  type: string
                  minLength: 12
      responses:
        '204':
          description: Senha alterada; demais sessões revogadas
        '400':
          description: Senha fora da política (VALIDATION_ERROR)
        '401':
          description: Sem token (INVALID_TOKEN) ou senha atual incorreta (CURRENT_PASSWORD_INVALID)
        '422':
          description: Nova senha igual à atual (SAME_PASSWORD)

  /trust-passports:
    post:
      tags: [Trust Passport]
      summary: TPS-001 — Criar o próprio Trust Passport (fallback manual)
      description: >
        Caminho normal é automático (consumer de Identity.Created). Este endpoint é o
        fallback explícito; a Identity vem do token (anti-IDOR).
      operationId: createTrustPassport
      responses:
        '201':
          description: Passport criado (status ACTIVE, emailVerified true, completude 25)
          content:
            application/json:
              example:
                success: true
                data:
                  trustPassportId: '019fe736-…'
                  status: ACTIVE
        '401':
          description: Sem token (INVALID_TOKEN)
        '409':
          description: Já existe Passport para esta Identity (TRUST_PASSPORT_ALREADY_EXISTS)

  /trust-passports/me:
    get:
      tags: [Trust Passport]
      summary: TPS-002 — Consultar o próprio Trust Passport
      operationId: getMyTrustPassport
      responses:
        '200':
          description: Estado atual do Passport
          content:
            application/json:
              example:
                success: true
                data:
                  trustPassportId: '019fe736-…'
                  status: ACTIVE
                  profileCompletion: 25
                  emailVerified: true
                  phoneVerified: false
                  documentVerified: false
                  addressVerified: false
                  phone: null
                  address: null
                  createdAt: '2026-08-09T12:00:00.000Z'
                  updatedAt: '2026-08-09T12:00:00.000Z'
        '401':
          description: Sem token (INVALID_TOKEN)
        '404':
          description: Passport ainda não criado (TRUST_PASSPORT_NOT_FOUND)
    put:
      tags: [Trust Passport]
      summary: TPS-003 — Atualizar atributos EDITABLE (phone/address)
      description: >
        Alterar um atributo verificável revoga sua verificação e recalcula a completude.
        Campos imutáveis não são aceitos pelo schema. Publica TrustPassport.Updated.
      operationId: updateMyTrustPassport
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                phone:
                  type: string
                  example: '+55 11 99999-9999'
                address:
                  type: object
                  required: [country, state, city]
                  properties:
                    country: { type: string, minLength: 2, maxLength: 2, example: BR }
                    state: { type: string, example: SP }
                    city: { type: string, example: Valinhos }
      responses:
        '200':
          description: Passport atualizado
          content:
            application/json:
              example:
                success: true
                data:
                  trustPassportId: '019fe736-…'
                  profileCompletion: 25
                  updatedAt: '2026-08-09T12:05:00.000Z'
        '400':
          description: Payload inválido (VALIDATION_ERROR)
        '401':
          description: Sem token (INVALID_TOKEN)
        '404':
          description: Passport não encontrado (TRUST_PASSPORT_NOT_FOUND)

  /verifications:
    get:
      tags: [Verification]
      summary: VRF-006 — Minhas verificações
      description: >
        Todas as verificações do próprio Passport, da mais recente para a mais
        antiga, com as evidências já enviadas — é o que a tela usa para saber o
        que ainda falta enviar.
      operationId: listMyVerifications
      responses:
        '200': { description: 'Lista com status, tentativa, evidências e decisão' }
    post:
      tags: [Verification]
      summary: VRF-001 — Iniciar verificação para o próprio Passport
      operationId: createVerification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type]
              properties:
                type:
                  type: string
                  enum: [DOCUMENT, ADDRESS, BANK_ACCOUNT, BUSINESS, BIOMETRIC]
                  description: PHONE/EMAIL entram na fase de OTP.
      responses:
        '201':
          description: Verificação criada em WAITING_FOR_EVIDENCE
          content:
            application/json:
              example:
                success: true
                data: { verificationId: '019fe744-…', type: DOCUMENT, status: WAITING_FOR_EVIDENCE }
        '400': { description: Tipo inválido (VALIDATION_ERROR) }
        '404': { description: Passport inexistente (TRUST_PASSPORT_NOT_FOUND) }
        '409': { description: Já existe verificação ativa deste tipo (VERIFICATION_ALREADY_EXISTS) }

  /verifications/queue/pending:
    get:
      tags: [Verification]
      summary: VRF-003 — Fila de análise (ADMIN)
      description: >
        Verificações aguardando decisão, da mais antiga para a mais recente.
        Traz nome e e-mail do titular (quem revisa precisa saber de quem é o
        documento) e a lista de evidências enviadas — nunca o conteúdo dos
        arquivos (VRF-006 BR-004).
      operationId: listVerificationQueue
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [WAITING_FOR_EVIDENCE, PENDING_REVIEW, IN_REVIEW, APPROVED, REJECTED]
          description: 'Padrão: PENDING_REVIEW + IN_REVIEW.'
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: size, in: query, schema: { type: integer, default: 20, maximum: 50 } }
      responses:
        '200': { description: Itens da fila + pagination }
        '403': { description: Não é admin (ADMIN_REQUIRED) }

  /verifications/{verificationId}/evidence:
    post:
      tags: [Verification]
      summary: VRF-002 — Enviar evidência (multipart)
      description: >
        multipart/form-data com campo `type` (ex.: DOCUMENT_FRONT, DOCUMENT_BACK, PROOF_OF_ADDRESS,
        BANK_STATEMENT, BUSINESS_REGISTRATION, SELFIE) e arquivo em `file` (jpeg/png/webp/pdf, máx. 10 MB).
        Quando todas as evidências obrigatórias forem enviadas, o status vira PENDING_REVIEW.
      operationId: submitVerificationEvidence
      parameters:
        - { name: verificationId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '201':
          description: Evidência aceita; retorna o status atual
        '403': { description: Não é o dono (VERIFICATION_ACCESS_DENIED) }
        '404': { description: Verificação não encontrada }
        '409': { description: Status não aceita evidências (INVALID_VERIFICATION_STATUS) }
        '413': { description: Arquivo grande demais (FILE_TOO_LARGE) }
        '415': { description: MIME não permitido (UNSUPPORTED_MEDIA_TYPE) }
        '422': { description: Tipo de evidência não requerido (EVIDENCE_TYPE_NOT_REQUIRED) }

  /verifications/{verificationId}/review:
    post:
      tags: [Verification]
      summary: VRF-003 — Iniciar revisão (ADMIN)
      operationId: reviewVerification
      parameters:
        - { name: verificationId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reviewType: { type: string, enum: [AUTOMATIC, MANUAL, EXTERNAL_PROVIDER], default: MANUAL }
      responses:
        '201': { description: Revisão iniciada (IN_REVIEW) }
        '403': { description: Requer admin (ADMIN_REQUIRED) }
        '409': { description: Status inválido (INVALID_VERIFICATION_STATUS) }

  /verifications/{verificationId}/approve:
    post:
      tags: [Verification]
      summary: VRF-004 — Aprovar (ADMIN; irreversível)
      operationId: approveVerification
      parameters:
        - { name: verificationId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { comments: { type: string } } }
      responses:
        '200': { description: APPROVED; publica Verification.Approved + ReviewCompleted }
        '403': { description: Requer admin (ADMIN_REQUIRED) }
        '409': { description: Status inválido (INVALID_VERIFICATION_STATUS) }

  /verifications/{verificationId}/reject:
    post:
      tags: [Verification]
      summary: VRF-005 — Rejeitar com motivo do catálogo (ADMIN; irreversível)
      operationId: rejectVerification
      parameters:
        - { name: verificationId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reasonCode]
              properties:
                reasonCode:
                  type: string
                  enum: [DOCUMENT_UNREADABLE, DOCUMENT_EXPIRED, DOCUMENT_INCOMPLETE, FACE_MISMATCH, ADDRESS_INVALID, PHONE_VERIFICATION_FAILED, FRAUD_SUSPECTED, INSUFFICIENT_EVIDENCE, OTHER]
                comments: { type: string }
      responses:
        '200': { description: REJECTED; nova tentativa exige nova verificação }
        '403': { description: Requer admin (ADMIN_REQUIRED) }
        '409': { description: Status inválido (INVALID_VERIFICATION_STATUS) }

  /verifications/{verificationId}:
    get:
      tags: [Verification]
      summary: VRF-006 — Consultar (dono ou admin; só metadados de arquivos)
      operationId: getVerification
      parameters:
        - { name: verificationId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Detalhes com review, decisão e metadados das evidências }
        '403': { description: Não é dono nem admin (VERIFICATION_ACCESS_DENIED) }
        '404': { description: Não encontrada (VERIFICATION_NOT_FOUND) }

  /trust-scores/me:
    get:
      tags: [Trust Score]
      summary: TRS-005 — Meu score e nível (escala 0–1000, P4)
      operationId: getMyTrustScore
      responses:
        '200':
          content:
            application/json:
              example:
                success: true
                data: { trustPassportId: '019fe7…', score: 175, level: BRONZE, calculatedAt: '2026-08-09T13:20:00.000Z' }
        '404': { description: Score ainda não criado (TRUST_SCORE_NOT_FOUND) }

  /trust-scores/me/timeline:
    get:
      tags: [Trust Score]
      summary: TRS-006 — Timeline explicável dos trust events (paginada)
      operationId: getMyTrustTimeline
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, default: 20, maximum: 100 } }
      responses:
        '200':
          content:
            application/json:
              example:
                success: true
                data:
                  - { id: '019fe7…', eventName: Verification.Approved, points: 150, occurredAt: '2026-08-09T13:15:00.000Z' }
                  - { id: '019fe7…', eventName: TrustPassport.Created, points: 25, occurredAt: '2026-08-09T13:10:00.000Z' }
                pagination: { page: 1, pageSize: 20, totalItems: 2, totalPages: 1 }

  /admin/trust-score-rules:
    get:
      tags: [Trust Score]
      summary: TRS-009 — Listar regras de pontuação (ADMIN)
      operationId: listTrustScoreRules
      responses: { '200': { description: Regras com condições JSON (P5) }, '403': { description: ADMIN_REQUIRED } }
    post:
      tags: [Trust Score]
      summary: TRS-009 — Criar regra de pontuação (ADMIN)
      operationId: createTrustScoreRule
      requestBody:
        required: true
        content:
          application/json:
            example:
              eventName: MarketplaceOrder.Completed
              description: Pedido concluído com sucesso
              points: 20
              conditions: [{ field: role, op: eq, value: PROVIDER }]
              maxOccurrences: null
              active: true
      responses: { '201': { description: Regra criada }, '403': { description: ADMIN_REQUIRED } }

  /admin/trust-score-rules/{id}:
    patch:
      tags: [Trust Score]
      summary: TRS-009 — Editar regra (pontos/condições/ativa) (ADMIN)
      operationId: updateTrustScoreRule
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: Regra atualizada }, '403': { description: ADMIN_REQUIRED } }

  /admin/trust-level-rules:
    get:
      tags: [Trust Score]
      summary: TRS-008 — Listar faixas de nível (ADMIN)
      operationId: listTrustLevelRules
      responses: { '200': { description: 'Seed P4: UNVERIFIED 0 / BRONZE 1–249 / SILVER 250–499 / GOLD 500–749 / PLATINUM 750–1000' } }

  /admin/trust-level-rules/{id}:
    patch:
      tags: [Trust Score]
      summary: TRS-008 — Ajustar faixa de nível (ADMIN)
      operationId: updateTrustLevelRule
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: Faixa atualizada } }

  /trust-benefits/me:
    get:
      tags: [Trust Score]
      summary: TRS-011 — Meus benefícios (elegibilidade avaliada on-demand)
      operationId: getMyTrustBenefits
      responses:
        '200':
          content:
            application/json:
              example:
                success: true
                data:
                  - { id: '019fe7…', name: Selo Verificado no Marketplace, description: '…', eligible: true }
                  - { id: '019fe7…', name: Destaque nas buscas, description: '…', eligible: false }

  /admin/trust-benefits:
    get:
      tags: [Trust Score]
      summary: TRS-010 — Listar benefícios (ADMIN)
      operationId: listTrustBenefits
      responses: { '200': { description: 'Benefícios com condições de elegibilidade sobre {score, level}' } }
    post:
      tags: [Trust Score]
      summary: TRS-010 — Criar benefício (ADMIN)
      operationId: createTrustBenefit
      responses: { '201': { description: Criado } }

  /admin/trust-benefits/{id}:
    patch:
      tags: [Trust Score]
      summary: TRS-010 — Editar benefício (ADMIN)
      operationId: updateTrustBenefit
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: Atualizado } }

  /admin/trust-scores/{trustPassportId}/rebuild:
    post:
      tags: [Trust Score]
      summary: TRS-007 — Recalcular score do event store (ADMIN; síncrono no MVP)
      operationId: rebuildTrustScore
      parameters: [{ name: trustPassportId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: 'Score recalculado deterministicamente; publica TrustScore.Calculated com rebuild: true' }
        '404': { description: Score não encontrado (TRUST_SCORE_NOT_FOUND) }

  /trust-badges/me:
    get:
      tags: [Trust Score]
      summary: TRS-014 — Meus badges concedidos
      operationId: getMyBadges
      responses: { '200': { description: 'Badges ativos com catálogo: [{code, name, description, badgeType, awardedAt}]' } }

  /trust-profile/me:
    get:
      tags: [Trust Score]
      summary: TRS-015 — Perfil de confiança consolidado (PRIVATE_VIEW, sempre completo)
      operationId: getMyTrustProfile
      responses:
        '200':
          content:
            application/json:
              example:
                success: true
                data:
                  view: PRIVATE_VIEW
                  displayName: Maria Silva Santos
                  level: BRONZE
                  score: 175
                  profileCompletion: 50
                  verifications: { emailVerified: true, phoneVerified: false, documentVerified: true, addressVerified: false }
                  badges: [{ code: TRUSTED_MEMBER, name: Membro Confiável, badgeType: PERMANENT }]
                  memberSince: '2026-08-09T12:00:00.000Z'

  /trust-profile/visibility:
    get:
      tags: [Trust Score]
      summary: TRS-016 — Minhas políticas de visibilidade pública
      operationId: getVisibility
      responses: { '200': { description: '{showScore, showLevel, showBadges, showVerifications} (default tudo true)' } }
    put:
      tags: [Trust Score]
      summary: TRS-016 — Atualizar o que aparece no perfil público
      operationId: updateVisibility
      responses: { '200': { description: Política atualizada } }

  /trust-profile/shares:
    post:
      tags: [Trust Score]
      summary: TRS-017 — Criar link compartilhável do perfil (token HMAC, expira)
      operationId: createProfileShare
      requestBody: { content: { application/json: { schema: { type: object, properties: { expiresInDays: { type: integer, default: 30, maximum: 90 } } } } } }
      responses: { '201': { description: '{shareId, shareUrl (APP_BASE_URL/p/<token>), expiresAt}' } }
    get:
      tags: [Trust Score]
      summary: TRS-017 — Listar meus links (ACTIVE/EXPIRED/REVOKED)
      operationId: listProfileShares
      responses: { '200': { description: Lista com status } }

  /trust-profile/shares/{id}:
    delete:
      tags: [Trust Score]
      summary: TRS-019 — Revogar link compartilhado
      operationId: revokeProfileShare
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '204': { description: 'Revogado; o link público passa a responder 410' } }

  /trust-profile/shares/{id}/access-history:
    get:
      tags: [Trust Score]
      summary: TRS-020 — Histórico de acessos ao link (dono; paginado)
      operationId: shareAccessHistory
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: '[{accessedAt, ipAddress, userAgent}] + pagination' } }

  /public/trust-profile/{token}:
    get:
      tags: [Trust Score]
      summary: TRS-015 — Perfil PÚBLICO via link compartilhado (sem auth)
      description: Respeita as políticas de visibilidade; nome abreviado; registra o acesso (TRS-020).
      operationId: getSharedProfile
      security: []
      parameters: [{ name: token, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: PUBLIC_VIEW do perfil }
        '404': { description: Link inexistente/forjado (SHARE_NOT_FOUND) }
        '410': { description: Link expirado ou revogado (SHARE_LINK_GONE) }

  /public/trust-profile/{token}/verify:
    get:
      tags: [Trust Score]
      summary: TRS-018 — Verificar autenticidade do link (HMAC; sem auth)
      operationId: verifySharedProfile
      security: []
      parameters: [{ name: token, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: '{authentic: true, issuedAt, expiresAt} ou {authentic: false, reason: INVALID_SIGNATURE|UNKNOWN_LINK|REVOKED|EXPIRED}' }

  /admin/trust-badges:
    get: { tags: [Trust Score], summary: TRS-012 — Listar catálogo de badges (ADMIN), operationId: listBadges, responses: { '200': { description: OK } } }
    post: { tags: [Trust Score], summary: TRS-012 — Criar badge (ADMIN), operationId: createBadge, responses: { '201': { description: 'code/name/description/badgeType(PERMANENT|DYNAMIC)/criteria JSON sobre {score, level}' } } }

  /admin/trust-badges/{id}:
    patch:
      tags: [Trust Score]
      summary: TRS-012 — Editar badge (ADMIN)
      operationId: updateBadge
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: Atualizado } }

  # ── Marketplace (Módulo 6 — MRK-001..008) ─────────────────────────────────
  /marketplace/listings:
    get:
      tags: [Marketplace]
      summary: MRK-004 — Buscar anúncios publicados (sem auth)
      description: >
        Só retorna anúncios PUBLISHED. Filtros combináveis; ordenação por
        relevance (padrão) | recent | price_asc | price_desc | trust_score.
        `minimumTrustLevel` filtra pelo nível do anunciante (Trust Layer).
      operationId: searchMarketplaceListings
      security: []
      parameters:
        - { name: q, in: query, schema: { type: string, minLength: 2 } }
        - { name: category, in: query, schema: { type: string }, description: 'Código da categoria (ex.: ELECTRICAL)' }
        - { name: listingType, in: query, schema: { type: string, enum: [PRODUCT, SERVICE] } }
        - { name: minPrice, in: query, schema: { type: number } }
        - { name: maxPrice, in: query, schema: { type: number } }
        - { name: currency, in: query, schema: { type: string, minLength: 3, maxLength: 3 } }
        - { name: location, in: query, schema: { type: string } }
        - { name: minimumTrustLevel, in: query, schema: { type: string }, description: 'Ex.: SILVER — inclui os níveis acima' }
        - { name: sort, in: query, schema: { type: string, enum: [relevance, recent, price_asc, price_desc, trust_score] } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: size, in: query, schema: { type: integer, default: 20, maximum: 50 } }
      responses:
        '200':
          description: Resumo dos anúncios + bloco pagination
          content:
            application/json:
              example:
                success: true
                data:
                  - listingId: 019fe8f0-0000-7000-8000-000000000001
                    title: Montagem de móveis e pequenos reparos
                    excerpt: Atendo toda a região central, com garantia de 90 dias…
                    listingType: SERVICE
                    category: HOME_REPAIRS
                    categoryName: Reparos e Manutenção
                    price: 180
                    currency: BRL
                    location: São Paulo/SP
                    imageUrl: https://cdn.trustplatform.test/foto-1.jpg
                    publishedAt: '2026-08-09T18:00:00.000Z'
                    viewCount: 12
                    seller: { trustScore: 25, trustLevel: BRONZE }
                pagination: { page: 1, pageSize: 20, totalItems: 1, totalPages: 1 }
        '400': { description: Parâmetros inválidos (VALIDATION_ERROR) }
    post:
      tags: [Marketplace]
      summary: MRK-001 — Criar anúncio (nasce em DRAFT)
      description: >
        Só `title` é obrigatório: o rascunho pode nascer incompleto (BR-004) e a
        obrigatoriedade dos demais campos é cobrada na publicação (MRK-003
        BR-003). Ver INCONSISTENCIAS #29.
      operationId: createMarketplaceListing
      requestBody:
        required: true
        content:
          application/json:
            example:
              title: Montagem de móveis e pequenos reparos
              description: Atendo toda a região central, com garantia de 90 dias no serviço.
              listingType: SERVICE
              category: HOME_REPAIRS
              price: 180
              currency: BRL
              location: São Paulo/SP
              images: ['https://cdn.trustplatform.test/foto-1.jpg']
      responses:
        '201': { description: 'Anúncio criado em DRAFT; `publishing.missingFields` lista o que falta' }
        '401': { description: Sem token (INVALID_TOKEN) }
        '422': { description: Categoria inexistente/inativa (MARKETPLACE_CATEGORY_NOT_FOUND) }

  /marketplace/listings/categories:
    get:
      tags: [Marketplace]
      summary: Categorias ativas e seus requisitos de reputação (sem auth)
      operationId: listMarketplaceCategories
      security: []
      responses:
        '200': { description: '[{code, name, description, minimumTrustLevel, minimumScore}]' }

  /marketplace/listings/mine:
    get:
      tags: [Marketplace]
      summary: Meus anúncios (inclui rascunhos e pendências de publicação)
      operationId: listMyMarketplaceListings
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: size, in: query, schema: { type: integer, default: 20, maximum: 50 } }
      responses: { '200': { description: Resumo + status + missingFields, paginado } }

  /marketplace/listings/{listingId}:
    get:
      tags: [Marketplace]
      summary: MRK-005 — Detalhe do anúncio (sem auth)
      description: >
        Público vê só PUBLISHED e o resumo do anunciante conforme as Visibility
        Policies (TRS-016). Com Bearer token do dono, devolve o próprio anúncio
        em qualquer status e não conta visualização.
      operationId: getMarketplaceListing
      security: []
      parameters: [{ name: listingId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200':
          description: Anúncio completo (+ seller na visão pública)
          content:
            application/json:
              example:
                success: true
                data:
                  listingId: 019fe8f0-0000-7000-8000-000000000001
                  title: Montagem de móveis e pequenos reparos
                  status: PUBLISHED
                  price: 180
                  currency: BRL
                  images: ['https://cdn.trustplatform.test/foto-1.jpg']
                  viewCount: 13
                  seller:
                    displayName: João F.
                    trustLevel: BRONZE
                    trustScore: 25
                    badges: [{ code: TRUSTED_MEMBER, name: Membro Confiável }]
                    verifications: { emailVerified: true, phoneVerified: false, documentVerified: false, addressVerified: false }
                    memberSince: '2026-08-09T12:00:00.000Z'
        '404': { description: Inexistente ou não publicado (MARKETPLACE_LISTING_NOT_FOUND) }
    put:
      tags: [Marketplace]
      summary: MRK-002 — Atualizar anúncio (só o dono; não altera status)
      operationId: updateMarketplaceListing
      parameters: [{ name: listingId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            example: { price: 200, location: São Paulo/SP }
      responses:
        '200': { description: Atualizado (publica MarketplaceListing.Updated com updatedFields) }
        '403': { description: Não é o dono (MARKETPLACE_LISTING_FORBIDDEN) }
        '404': { description: Não encontrado }
        '409': { description: Status não permite mais edição (MARKETPLACE_LISTING_NOT_EDITABLE) }

  /marketplace/listings/{listingId}/publish:
    post:
      tags: [Marketplace]
      summary: MRK-003 — Publicar anúncio (exige conta ativa + reputação da categoria)
      operationId: publishMarketplaceListing
      parameters: [{ name: listingId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: 'PUBLISHED + publishedAt; publica MarketplaceListing.Published' }
        '403': { description: 'Não é o dono, conta inativa ou nível insuficiente (MARKETPLACE_PUBLICATION_NOT_ALLOWED)' }
        '404': { description: Não encontrado }
        '409': { description: Já publicado (MARKETPLACE_LISTING_ALREADY_PUBLISHED) }
        '422': { description: 'Campos obrigatórios ausentes (MARKETPLACE_LISTING_INCOMPLETE)' }

  /marketplace/listings/{listingId}/contact:
    post:
      tags: [Marketplace]
      summary: MRK-006 — Entrar em contato com o anunciante
      description: >
        201 quando abre a conversa; **200 quando reutiliza** uma conversa ativa
        entre as mesmas partes para o mesmo anúncio (BR-005 + INCONSISTENCIAS
        #9 — nunca 409, nunca duplicata).
      operationId: contactMarketplaceListingOwner
      parameters: [{ name: listingId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            example: { message: 'Olá! Você atende no sábado de manhã?' }
      responses:
        '201': { description: '{conversation, message, created: true}' }
        '200': { description: '{conversation, message, created: false} — conversa ativa reaproveitada' }
        '404': { description: 'Anúncio inexistente ou indisponível (MARKETPLACE_LISTING_UNAVAILABLE)' }
        '422': { description: 'Contato com o próprio anúncio (CANNOT_CONTACT_OWN_LISTING)' }

  /marketplace/conversations:
    get:
      tags: [Marketplace]
      summary: MRK-007 — Minhas conversas (como comprador ou vendedor)
      operationId: listMarketplaceConversations
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: size, in: query, schema: { type: integer, default: 20, maximum: 50 } }
      responses:
        '200': { description: '[{conversationId, listingId, listingTitle, counterpartName, status, lastMessageAt, lastMessagePreview, unreadCount}] + pagination' }

  /marketplace/conversations/{conversationId}:
    get:
      tags: [Marketplace]
      summary: MRK-007 — Conversa + histórico de mensagens (só participantes)
      operationId: getMarketplaceConversation
      parameters:
        - { name: conversationId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: size, in: query, schema: { type: integer, default: 50, maximum: 100 } }
      responses:
        '200': { description: '{conversation, messages[], pagination}' }
        '403': { description: Não é participante (MARKETPLACE_CONVERSATION_FORBIDDEN) }
        '404': { description: Não encontrada (MARKETPLACE_CONVERSATION_NOT_FOUND) }

  /marketplace/conversations/{conversationId}/messages:
    post:
      tags: [Marketplace]
      summary: MRK-007 — Enviar mensagem (só participantes, só conversa OPEN)
      operationId: sendMarketplaceMessage
      parameters: [{ name: conversationId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            example: { message: 'Bom dia! Atendo sim, sábado às 8h.' }
      responses:
        '201': { description: 'Mensagem registrada (imutável); publica MarketplaceMessage.Sent' }
        '403': { description: Não é participante }
        '409': { description: Conversa encerrada (MARKETPLACE_CONVERSATION_CLOSED) }

  /marketplace/conversations/{conversationId}/read:
    patch:
      tags: [Marketplace]
      summary: MRK-007 — Marcar como lidas as mensagens recebidas
      operationId: markMarketplaceMessagesAsRead
      parameters: [{ name: conversationId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: '{messagesRead}; publica MarketplaceConversation.Read quando houver mudança' } }

  /marketplace/conversations/{conversationId}/close:
    post:
      tags: [Marketplace]
      summary: MRK-008 — Encerrar conversa (histórico preservado)
      operationId: closeMarketplaceConversation
      parameters: [{ name: conversationId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        content:
          application/json:
            example: { reason: 'Negociação concluída.' }
      responses:
        '200': { description: 'CLOSED + closedAt/closedBy; publica MarketplaceConversation.Closed' }
        '403': { description: Não é participante }
        '409': { description: Já encerrada (MARKETPLACE_CONVERSATION_ALREADY_CLOSED) }

  # ── Negociação (Módulo 7 — MRK-009..014 + o pedido do MRK-015) ────────────
  /marketplace/conversations/{conversationId}/offers:
    post:
      tags: [Marketplace]
      summary: MRK-009 — Enviar proposta (só o comprador da conversa)
      description: >
        Exige conversa OPEN e anúncio PUBLISHED. Uma proposta viva por
        negociação: com outra PENDING em aberto responde 409 — atualize, retire
        ou decida antes (INCONSISTENCIAS #34). Moeda omitida herda a do anúncio.
      operationId: createMarketplaceOffer
      parameters: [{ name: conversationId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            example:
              amount: 540
              quantity: 1
              expiresAt: '2026-08-17T23:59:59Z'
              notes: Posso pagar à vista.
      responses:
        '201': { description: 'Proposta PENDING; publica MarketplaceOffer.Created' }
        '403': { description: 'Não é o comprador da conversa (MARKETPLACE_OFFER_NOT_RECIPIENT)' }
        '404': { description: 'Conversa inexistente ou anúncio indisponível' }
        '409': { description: 'Conversa encerrada (MARKETPLACE_CONVERSATION_CLOSED) ou já há proposta viva (MARKETPLACE_OFFER_ALREADY_EXISTS)' }
        '422': { description: 'Valor/quantidade ≤ 0 ou validade no passado (MARKETPLACE_OFFER_INVALID)' }
    get:
      tags: [Marketplace]
      summary: MRK-012 — Histórico da negociação (cadeia de propostas)
      operationId: listMarketplaceOffers
      parameters: [{ name: conversationId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: 'Rodadas da mais antiga para a mais nova, com parentOfferId encadeado' }
        '403': { description: Não é participante }

  /marketplace/offers/{offerId}:
    get:
      tags: [Marketplace]
      summary: Consultar proposta (comprador ou vendedor)
      operationId: getMarketplaceOffer
      parameters: [{ name: offerId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: 'Proposta; `status` é o efetivo — PENDING vencida aparece como EXPIRED' }
        '403': { description: Não é participante }
        '404': { description: Não encontrada (MARKETPLACE_OFFER_NOT_FOUND) }
    put:
      tags: [Marketplace]
      summary: MRK-010 — Atualizar proposta pendente (só quem a criou)
      description: 'Campos alteráveis: amount, quantity, expiresAt, notes. Moeda e partes não mudam.'
      operationId: updateMarketplaceOffer
      parameters: [{ name: offerId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            example: { amount: 520 }
      responses:
        '200': { description: 'Atualizada; publica MarketplaceOffer.Updated com updatedFields' }
        '403': { description: Não foi quem propôs (MARKETPLACE_OFFER_FORBIDDEN) }
        '409': { description: 'Já decidida (MARKETPLACE_OFFER_ALREADY_RESOLVED) ou vencida (MARKETPLACE_OFFER_EXPIRED)' }

  /marketplace/offers/{offerId}/withdraw:
    post:
      tags: [Marketplace]
      summary: MRK-011 — Retirar proposta (só quem a criou)
      operationId: withdrawMarketplaceOffer
      parameters: [{ name: offerId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        content:
          application/json:
            example: { reason: Encontrei outra solução. }
      responses:
        '200': { description: 'WITHDRAWN com autor/momento/motivo; a proposta nunca é apagada' }
        '403': { description: Não foi quem propôs }
        '409': { description: Já decidida ou vencida }

  /marketplace/offers/{offerId}/counter:
    post:
      tags: [Marketplace]
      summary: MRK-012 — Contrapor (só quem RECEBEU a proposta)
      description: >
        A proposta recebida vira COUNTERED e nasce a rodada seguinte com
        `parentOfferId` apontando para ela. A moeda é herdada da negociação e
        quem decide passa a ser o outro lado. Sem limite de rodadas.
      operationId: counterMarketplaceOffer
      parameters: [{ name: offerId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            example:
              amount: 580
              expiresAt: '2026-08-15T23:59:59Z'
              notes: Consigo fechar nesse valor.
      responses:
        '201': { description: 'Contraoferta PENDING; publica MarketplaceOffer.Countered' }
        '403': { description: 'Quem propôs não contrapõe a si mesmo (MARKETPLACE_OFFER_NOT_RECIPIENT)' }
        '409': { description: Proposta já decidida ou vencida }

  /marketplace/offers/{offerId}/accept:
    post:
      tags: [Marketplace]
      summary: MRK-013 — Aceitar proposta (só quem a RECEBEU)
      description: >
        Pivô do marketplace, tudo em UMA transação: proposta → ACCEPTED, demais
        propostas vivas → CLOSED, anúncio → RESERVED e criação do
        MarketplaceOrder. Publica MarketplaceOffer.Accepted,
        MarketplaceListing.Reserved e MarketplaceOrder.Created.
      operationId: acceptMarketplaceOffer
      parameters: [{ name: offerId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200':
          description: Negociação convertida em pedido
          content:
            application/json:
              example:
                success: true
                data:
                  offer: { offerId: 019fe8f0-0000-7000-8000-000000000010, status: ACCEPTED }
                  order:
                    orderId: 019fe8f0-0000-7000-8000-000000000020
                    offerId: 019fe8f0-0000-7000-8000-000000000010
                    amount: 540
                    currency: BRL
                    status: CREATED
                  listingStatus: RESERVED
                  closedOfferIds: []
        '403': { description: Quem propôs não aceita a própria proposta }
        '409': { description: 'Proposta já decidida/vencida ou anúncio não reservável (MARKETPLACE_LISTING_NOT_AVAILABLE)' }

  /marketplace/offers/{offerId}/reject:
    post:
      tags: [Marketplace]
      summary: MRK-014 — Rejeitar proposta (só quem a RECEBEU)
      description: A conversa permanece aberta; uma nova rodada pode começar em seguida.
      operationId: rejectMarketplaceOffer
      parameters: [{ name: offerId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        content:
          application/json:
            example: { reason: Valor acima do orçamento. }
      responses:
        '200': { description: 'REJECTED; publica MarketplaceOffer.Rejected' }
        '403': { description: Não é o destinatário da proposta }
        '409': { description: Já decidida ou vencida }

  # ── Ciclo do pedido (Módulo 8 — MRK-015..022) ─────────────────────────────
  /marketplace/orders:
    get:
      tags: [Marketplace]
      summary: Meus pedidos (como comprador ou vendedor)
      description: 'Pedidos nascem apenas do aceite (MRK-015 BR-001): não há criação manual.'
      operationId: listMarketplaceOrders
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: size, in: query, schema: { type: integer, default: 20, maximum: 50 } }
      responses: { '200': { description: Pedidos + pagination } }

  /marketplace/orders/{orderId}:
    get:
      tags: [Marketplace]
      summary: MRK-016 — Consultar pedido (visão consolidada)
      description: >
        Traz status, **próxima ação esperada**, agendamento e a linha do tempo
        da transação (criação, agendamento, check-in, check-out, confirmação,
        cancelamento). Toda consulta é auditada (BR-005).
      operationId: getMarketplaceOrder
      parameters: [{ name: orderId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200':
          description: Pedido consolidado
          content:
            application/json:
              example:
                success: true
                data:
                  orderId: 019fe8f0-0000-7000-8000-000000000020
                  status: AWAITING_CUSTOMER_CONFIRMATION
                  nextAction: AWAITING_CUSTOMER_CONFIRMATION
                  amount: 1100
                  currency: BRL
                  actualDuration: 240
                  listingTitle: Pintura de apartamento com massa corrida
                  scheduling:
                    scheduledStart: '2026-08-11T12:00:00.000Z'
                    scheduledEnd: '2026-08-11T16:00:00.000Z'
                    estimatedDuration: 240
                    timezone: America/Sao_Paulo
                    status: ACTIVE
                  timeline:
                    - { type: ORDER_CREATED, occurredAt: '2026-08-10T10:00:00.000Z' }
                    - { type: SCHEDULED, occurredAt: '2026-08-10T10:05:00.000Z' }
                    - { type: CHECK_IN, occurredAt: '2026-08-11T12:00:00.000Z' }
                    - { type: CHECK_OUT, occurredAt: '2026-08-11T16:00:00.000Z' }
        '403': { description: Não é participante (MARKETPLACE_ORDER_FORBIDDEN) }
        '404': { description: Não encontrado (MARKETPLACE_ORDER_NOT_FOUND) }

  /marketplace/orders/{orderId}/schedule:
    post:
      tags: [Marketplace]
      summary: MRK-019 — Agendar o serviço
      description: >
        Válido em CREATED/AWAITING_SCHEDULING. O fim previsto é derivado do
        início + duração e a agenda do prestador é checada contra sobreposição
        (BR-004). Status vai para SCHEDULED.
      operationId: scheduleMarketplaceOrder
      parameters: [{ name: orderId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            example:
              scheduledStart: '2026-08-11T12:00:00Z'
              estimatedDuration: 240
              timezone: America/Sao_Paulo
      responses:
        '200': { description: 'SCHEDULED; publica MarketplaceOrder.Scheduled' }
        '409': { description: 'Agenda ocupada (MARKETPLACE_SCHEDULING_CONFLICT) ou transição inválida' }
        '422': { description: 'Janela inválida (MARKETPLACE_INVALID_SCHEDULING_WINDOW)' }

  /marketplace/orders/{orderId}/start:
    post:
      tags: [Marketplace]
      summary: MRK-020 — Check-in do prestador (inicia a execução)
      description: >
        Só o prestador. Geolocalização, endereço e observações são opcionais e
        informativos — nunca bloqueiam o início (BR-004). Status → IN_PROGRESS.
      operationId: startMarketplaceOrder
      parameters: [{ name: orderId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        content:
          application/json:
            example: { latitude: -23.5505, longitude: -46.6333, accuracy: 12.5, notes: Cheguei ao local. }
      responses:
        '200': { description: 'IN_PROGRESS; publica MarketplaceOrder.Started' }
        '403': { description: Não é o prestador }
        '409': { description: 'Pedido não está agendado (MARKETPLACE_ORDER_INVALID_TRANSITION)' }

  /marketplace/orders/{orderId}/complete:
    post:
      tags: [Marketplace]
      summary: MRK-021 — Check-out do prestador (conclui a execução)
      description: >
        Calcula a duração efetiva (check-in → check-out) e passa a bola ao
        cliente. Status → AWAITING_CUSTOMER_CONFIRMATION. O evento publicado é
        `MarketplaceOrder.ExecutionCompleted` (INCONSISTENCIAS #24 — check-out
        não é pedido concluído).
      operationId: completeMarketplaceOrderExecution
      parameters: [{ name: orderId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        content:
          application/json:
            example: { notes: Serviço finalizado, ambiente limpo. }
      responses:
        '200': { description: AWAITING_CUSTOMER_CONFIRMATION + actualDuration }
        '403': { description: Não é o prestador }
        '409': { description: Pedido não está em execução }

  /marketplace/orders/{orderId}/confirm-completion:
    post:
      tags: [Marketplace]
      summary: MRK-022 — Cliente confirma a conclusão
      description: >
        Só o comprador. **Não encerra o pedido** (BR-006): publica
        `MarketplaceOrder.CustomerConfirmed`, que dispara os processos
        obrigatórios — atualização do Trust Score (+40 para o prestador) e a
        transição automática para COMPLETED.
      operationId: confirmMarketplaceOrderCompletion
      parameters: [{ name: orderId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        content:
          application/json:
            example: { comments: Ficou impecável! }
      responses:
        '200': { description: 'CUSTOMER_CONFIRMED (COMPLETED chega logo depois, de forma assíncrona)' }
        '403': { description: Só o cliente confirma }
        '409': { description: Pedido não está aguardando confirmação }

  /marketplace/orders/{orderId}/cancel:
    post:
      tags: [Marketplace]
      summary: MRK-018 — Cancelar pedido (motivo obrigatório)
      description: >
        Permitido em CREATED, AWAITING_SCHEDULING, SCHEDULED e
        AWAITING_EXECUTION. A partir de IN_PROGRESS exige disputa ou revisão
        administrativa (BR-002). O cancelamento devolve o anúncio para
        PUBLISHED (INCONSISTENCIAS #12) e penaliza quem cancelou no Trust Score.
      operationId: cancelMarketplaceOrder
      parameters: [{ name: orderId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            example: { reason: Mudança de planos do cliente. }
      responses:
        '200': { description: 'CANCELLED; publica MarketplaceOrder.Cancelled' }
        '400': { description: Motivo ausente (VALIDATION_ERROR) }
        '403': { description: Não é participante }
        '409': { description: 'Estado não admite cancelamento (MARKETPLACE_ORDER_CANCELLATION_NOT_ALLOWED)' }

  # ── Disputas e avaliações (Módulo 9 — MRK-023..025) ───────────────────────
  /marketplace/review-catalog:
    get:
      tags: [Marketplace]
      summary: Catálogos de disputa e avaliação
      operationId: getMarketplaceReviewCatalog
      responses:
        '200': { description: '{disputeCategories[], decisionTypes[], reviewCriteria[]}' }

  /marketplace/orders/{orderId}/disputes:
    post:
      tags: [Marketplace]
      summary: MRK-023 — Abrir disputa (comprador ou vendedor)
      description: >
        Uma disputa ativa por pedido (BR-002). O pedido vai para DISPUTE_OPEN e
        nenhuma evidência já registrada é alterada (BR-006).
      operationId: openMarketplaceDispute
      parameters: [{ name: orderId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            example:
              category: SERVICE_PARTIALLY_EXECUTED
              description: O prestador montou apenas o guarda-roupa e foi embora.
      responses:
        '201': { description: 'Disputa OPEN; publica MarketplaceDispute.Opened' }
        '403': { description: Não é participante do pedido }
        '409': { description: 'Já existe disputa ativa (MARKETPLACE_DISPUTE_ALREADY_OPEN) ou o estado do pedido não admite disputa' }
        '422': { description: Categoria/descrição inválidas (MARKETPLACE_DISPUTE_INVALID) }
    get:
      tags: [Marketplace]
      summary: Disputas de um pedido (participantes)
      operationId: listMarketplaceOrderDisputes
      parameters: [{ name: orderId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: Disputas com a decisão, quando houver } }

  /marketplace/disputes/{disputeId}:
    get:
      tags: [Marketplace]
      summary: Consultar disputa (participantes ou ADMIN)
      operationId: getMarketplaceDispute
      parameters: [{ name: disputeId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Disputa + decisão }
        '403': { description: Não é participante nem admin }
        '404': { description: Não encontrada (MARKETPLACE_DISPUTE_NOT_FOUND) }

  /marketplace/disputes/{disputeId}/resolve:
    post:
      tags: [Marketplace]
      summary: MRK-024 — Decidir a disputa (ADMIN/mediador)
      description: >
        A decisão é **definitiva** (BR-006): disputa → RESOLVED e pedido →
        DISPUTE_RESOLVED. `UPHELD` e `PARTIALLY_UPHELD` reconhecem culpa da parte
        reclamada e viram penalidade no Trust Score; `REJECTED`, `SETTLED` e
        `CANCELLED` não penalizam ninguém.
      operationId: resolveMarketplaceDispute
      parameters: [{ name: disputeId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            example:
              decisionType: UPHELD
              justification: As fotos enviadas confirmam que apenas um móvel foi montado.
      responses:
        '200': { description: 'RESOLVED; publica MarketplaceDispute.Resolved' }
        '403': { description: Não é admin (ADMIN_REQUIRED) }
        '409': { description: 'Disputa já decidida (MARKETPLACE_DISPUTE_ALREADY_RESOLVED)' }

  /admin/marketplace/disputes:
    get:
      tags: [Marketplace]
      summary: MRK-024 — Fila de disputas ativas (ADMIN)
      operationId: listActiveMarketplaceDisputes
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: size, in: query, schema: { type: integer, default: 20, maximum: 50 } }
      responses: { '200': { description: Disputas OPEN/IN_ANALYSIS/MEDIATION + pagination } }

  /marketplace/orders/{orderId}/reviews:
    post:
      tags: [Marketplace]
      summary: MRK-025 — Avaliar a transação
      description: >
        Só participantes (BR-001), uma vez por pessoa (BR-002) e só depois de
        COMPLETED, CLOSED ou DISPUTE_RESOLVED (BR-003). A nota geral (1–5) é o
        único campo obrigatório. **Alimenta o Trust Score de quem foi avaliado**:
        4–5 → +30, 3 → +5, 1–2 → −30.
      operationId: reviewMarketplaceTransaction
      parameters: [{ name: orderId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            example:
              overallScore: 5
              recommended: true
              comment: Montou tudo em duas horas e deixou o quarto limpo.
              scores: { quality: 5, punctuality: 5, communication: 4 }
      responses:
        '201': { description: 'Avaliação registrada (imutável); publica MarketplaceReview.Created' }
        '403': { description: Não é participante do pedido }
        '409': { description: 'Já avaliou (MARKETPLACE_REVIEW_ALREADY_EXISTS) ou pedido ainda não avaliável (MARKETPLACE_REVIEW_NOT_ALLOWED)' }
        '422': { description: Nota fora da escala 1–5 (MARKETPLACE_REVIEW_INVALID) }
    get:
      tags: [Marketplace]
      summary: Avaliações de um pedido (participantes)
      operationId: listMarketplaceOrderReviews
      parameters: [{ name: orderId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: Avaliações das duas partes } }

  /marketplace/reviews/received:
    get:
      tags: [Marketplace]
      summary: Avaliações que recebi
      operationId: listReceivedMarketplaceReviews
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: size, in: query, schema: { type: integer, default: 20, maximum: 50 } }
      responses: { '200': { description: Avaliações recebidas + pagination } }

  /marketplace/reviews/summary:
    get:
      tags: [Marketplace]
      summary: Minha reputação transacional consolidada
      operationId: getMarketplaceReviewSummary
      responses:
        '200': { description: '{totalReviews, averageScore, recommendationRate}' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token ES256, 15 min (IDN-003). Padrão em todas as rotas não públicas.

security:
  - bearerAuth: []
