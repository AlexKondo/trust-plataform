                  badges: [{ code: TRUSTED_MEMBER, name: Membro Confiável, badgeType: PERMANENT }]
                  memberSince: '2026-08-09T12:00:00.000Z'

  /trust-profile/visibility:
    get:
      tags: [Trust Score]
      summary: TRS-016 — Minhas políticas de visibilidade pública
      operationId: getVisibility
      responses: { '200': { description: '{showScore, showLevel, showBadges, showVerifications, showSignals} (default tudo true; showSignals é IP-011)' } }
    put:
      tags: [Trust Score]
      summary: TRS-016 — Atualizar o que aparece no perfil público
      operationId: updateVisibility
      responses: { '200': { description: Política atualizada } }

  /trust-signals/me:
    get:
      tags: [Trust Score]
      summary: IP-011 — Meus Trust Signals (fatos objetivos, sem efeito no Trust Score)
      description: Registry tipado/versionado, paginado. Nunca inclui pontos — sinal não pontua (ver 04_APPROVED_PRODUCT_DECISIONS).
      operationId: getMyTrustSignals
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses: { '200': { description: '[{id, signalType, signalVersion, visibility, reasonKey, occurredAt}] + pagination' } }

  /public/trust-profile/{token}/signals:
    get:
      tags: [Trust Score]
      summary: IP-011 — Trust Signals PÚBLICOS via link compartilhado (sem auth)
      description: Só sinais com visibility=PUBLIC e apenas se a Visibility Policy do dono tem showSignals=true.
      operationId: getSharedTrustSignals
      security: []
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        '200': { description: '[{signalType, reasonKey, occurredAt}] + pagination (vazio se showSignals=false)' }
        '404': { description: Link inexistente/forjado (SHARE_NOT_FOUND) }
        '410': { description: Link expirado ou revogado (SHARE_LINK_GONE) }

  /trust-profile/shares:
    post:
      tags: [Trust Score]
      summary: TRS-017 — Criar link compartilhável do perfil (token HMAC, expira)
      operationId: createProfileShare
      requestBody: { content: { application/json: { schema: { type: object, properties: { expiresInDays: { type: integer, default: 30, maximum: 90 } } } } } }
      responses: { '201': { description: '{shareId, shareUrl (APP_BASE_URL/p/<token>), expiresAt}' } }
    get:
      tags: [Trust Score]
      summary: TRS-017 — Listar meus links (ACTIVE/EXPIRED/REVOKED)
      operationId: listProfileShares
      responses: { '200': { description: Lista com status } }

  /trust-profile/shares/{id}:
    delete:
      tags: [Trust Score]
      summary: TRS-019 — Revogar link compartilhado
      operationId: revokeProfileShare
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '204': { description: 'Revogado; o link público passa a responder 410' } }

  /trust-profile/shares/{id}/access-history:
    get:
      tags: [Trust Score]
      summary: TRS-020 — Histórico de acessos ao link (dono; paginado)
      operationId: shareAccessHistory
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: '[{accessedAt, ipAddress, userAgent}] + pagination' } }

  /public/trust-profile/{token}:
    get:
      tags: [Trust Score]
      summary: TRS-015 — Perfil PÚBLICO via link compartilhado (sem auth)
      description: Respeita as políticas de visibilidade; nome abreviado; registra o acesso (TRS-020).
      operationId: getSharedProfile
      security: []
      parameters: [{ name: token, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: PUBLIC_VIEW do perfil }
        '404': { description: Link inexistente/forjado (SHARE_NOT_FOUND) }
        '410': { description: Link expirado ou revogado (SHARE_LINK_GONE) }

  /public/trust-profile/{token}/verify:
    get:
      tags: [Trust Score]
      summary: TRS-018 — Verificar autenticidade do link (HMAC; sem auth)
      operationId: verifySharedProfile
      security: []
      parameters: [{ name: token, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: '{authentic: true, issuedAt, expiresAt} ou {authentic: false, reason: INVALID_SIGNATURE|UNKNOWN_LINK|REVOKED|EXPIRED}' }

  /admin/trust-badges:
    get: { tags: [Trust Score], summary: TRS-012 — Listar catálogo de badges (ADMIN), operationId: listBadges, responses: { '200': { description: OK } } }
    post: { tags: [Trust Score], summary: TRS-012 — Criar badge (ADMIN), operationId: createBadge, responses: { '201': { description: 'code/name/description/badgeType(PERMANENT|DYNAMIC)/criteria JSON sobre {score, level}' } } }

  /admin/trust-badges/{id}:
    patch:
      tags: [Trust Score]
      summary: TRS-012 — Editar badge (ADMIN)
      operationId: updateBadge
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: Atualizado } }

  # ── Marketplace (Módulo 6 — MRK-001..008) ─────────────────────────────────
  /marketplace/listings:
    get:
      tags: [Marketplace]
      summary: MRK-004 — Buscar anúncios publicados (sem auth)
      description: >
        Só retorna anúncios PUBLISHED. Filtros combináveis; ordenação por
        relevance (padrão) | recent | price_asc | price_desc | trust_score.
        `minimumTrustLevel` filtra pelo nível do anunciante (Trust Layer).
        IP-015: `relevance`, quando `q` é informado, ranqueia por
        correspondência textual determinística (full-text search nativo do
        Postgres sobre título+descrição — sem motor de busca externo nem
        IA/embedding); sem `q`, cai no mesmo critério de `recent`. Todo ramo
        de ordenação termina em `id` como desempate — paginação nunca repete
        nem pula um item por causa de empate em preço/score/data. Não existe
        nenhum campo de patrocínio/destaque no modelo (`marketplace_listings`
        não tem coluna `sponsored`/`boosted`) — nenhum ranking é influenciado
        por pagamento. `availableDayOfWeek` (IP-015) filtra só anúncios cujo
        dono declarou disponibilidade (IP-005) naquele dia da semana
        (0=domingo..6=sábado) — filtro opt-in de exibição, distinto da regra
        de agendamento (que não restringe nada quando o Partner não declarou
        nenhuma janela).
      operationId: searchMarketplaceListings
      security: []
      parameters:
        - { name: q, in: query, schema: { type: string, minLength: 2 } }
        - { name: category, in: query, schema: { type: string }, description: 'Código da categoria (ex.: ELECTRICAL)' }
        - { name: listingType, in: query, schema: { type: string, enum: [PRODUCT, SERVICE] } }
        - { name: minPrice, in: query, schema: { type: number } }
        - { name: maxPrice, in: query, schema: { type: number } }
        - { name: currency, in: query, schema: { type: string, minLength: 3, maxLength: 3 } }
        - { name: location, in: query, schema: { type: string } }
        - { name: minimumTrustLevel, in: query, schema: { type: string }, description: 'Ex.: SILVER — inclui os níveis acima' }
        - { name: availableDayOfWeek, in: query, schema: { type: integer, minimum: 0, maximum: 6 }, description: 'IP-015 — 0=domingo..6=sábado; só anúncios de Partners com janela declarada (IP-005) nesse dia' }
        - { name: sort, in: query, schema: { type: string, enum: [relevance, recent, price_asc, price_desc, trust_score] } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: size, in: query, schema: { type: integer, default: 20, maximum: 50 } }
      responses:
        '200':
          description: Resumo dos anúncios + bloco pagination
          content:
            application/json:
              example:
                success: true
                data:
                  - listingId: 019fe8f0-0000-7000-8000-000000000001
                    title: Montagem de móveis e pequenos reparos
                    excerpt: Atendo toda a região central, com garantia de 90 dias…
                    listingType: SERVICE
                    category: HOME_REPAIRS
                    categoryName: Reparos e Manutenção
                    price: 180
                    currency: BRL
                    location: São Paulo/SP
                    imageUrl: https://cdn.trustplatform.test/foto-1.jpg
                    publishedAt: '2026-08-09T18:00:00.000Z'
                    viewCount: 12
                    seller: { trustScore: 25, trustLevel: BRONZE }
                pagination: { page: 1, pageSize: 20, totalItems: 1, totalPages: 1 }
        '400': { description: Parâmetros inválidos (VALIDATION_ERROR) }
    post:
      tags: [Marketplace]
      summary: MRK-001 — Criar anúncio (nasce em DRAFT)
      description: >
        Só `title` é obrigatório: o rascunho pode nascer incompleto (BR-004) e a
        obrigatoriedade dos demais campos é cobrada na publicação (MRK-003
        BR-003). Ver INCONSISTENCIAS #29.
      operationId: createMarketplaceListing
      requestBody:
        required: true
        content:
          application/json:
            example:
              title: Montagem de móveis e pequenos reparos
              description: Atendo toda a região central, com garantia de 90 dias no serviço.
              listingType: SERVICE
              category: HOME_REPAIRS
              price: 180
              currency: BRL
              location: São Paulo/SP
              images: ['https://cdn.trustplatform.test/foto-1.jpg']
      responses:
        '201': { description: 'Anúncio criado em DRAFT; `publishing.missingFields` lista o que falta' }
        '401': { description: Sem token (INVALID_TOKEN) }
        '422': { description: Categoria inexistente/inativa (MARKETPLACE_CATEGORY_NOT_FOUND) }

  /marketplace/listings/categories:
    get:
      tags: [Marketplace]
      summary: Categorias ativas e seus requisitos de reputação (sem auth)
      operationId: listMarketplaceCategories
      security: []
      responses:
        '200': { description: '[{code, name, description, minimumTrustLevel, minimumScore}]' }

  /marketplace/listings/mine:
    get:
      tags: [Marketplace]
      summary: Meus anúncios (inclui rascunhos e pendências de publicação)
      operationId: listMyMarketplaceListings
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: size, in: query, schema: { type: integer, default: 20, maximum: 50 } }
      responses: { '200': { description: Resumo + status + missingFields, paginado } }

  /marketplace/listings/{listingId}:
    get:
      tags: [Marketplace]
      summary: MRK-005 — Detalhe do anúncio (sem auth)
      description: >
        Público vê só PUBLISHED e o resumo do anunciante conforme as Visibility
        Policies (TRS-016). Com Bearer token do dono, devolve o próprio anúncio
        em qualquer status e não conta visualização.
      operationId: getMarketplaceListing
      security: []
      parameters: [{ name: listingId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200':
          description: Anúncio completo (+ seller na visão pública)
          content:
            application/json:
              example:
                success: true
                data:
                  listingId: 019fe8f0-0000-7000-8000-000000000001
                  title: Montagem de móveis e pequenos reparos
                  status: PUBLISHED
                  price: 180
                  currency: BRL
                  images: ['https://cdn.trustplatform.test/foto-1.jpg']
                  viewCount: 13
                  seller:
                    displayName: João F.
                    trustLevel: BRONZE
                    trustScore: 25
                    badges: [{ code: TRUSTED_MEMBER, name: Membro Confiável }]
                    verifications: { emailVerified: true, phoneVerified: false, documentVerified: false, addressVerified: false }
                    memberSince: '2026-08-09T12:00:00.000Z'
        '404': { description: Inexistente ou não publicado (MARKETPLACE_LISTING_NOT_FOUND) }
    put:
      tags: [Marketplace]
      summary: MRK-002 — Atualizar anúncio (só o dono; não altera status)
      operationId: updateMarketplaceListing
      parameters: [{ name: listingId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            example: { price: 200, location: São Paulo/SP }
      responses:
        '200': { description: Atualizado (publica MarketplaceListing.Updated com updatedFields) }
        '403': { description: Não é o dono (MARKETPLACE_LISTING_FORBIDDEN) }
        '404': { description: Não encontrado }
        '409': { description: Status não permite mais edição (MARKETPLACE_LISTING_NOT_EDITABLE) }

  /marketplace/listings/{listingId}/publish:
    post:
      tags: [Marketplace]
      summary: MRK-003 — Publicar anúncio (exige conta ativa + reputação da categoria)
      operationId: publishMarketplaceListing
      parameters: [{ name: listingId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: 'PUBLISHED + publishedAt; publica MarketplaceListing.Published' }
        '403': { description: 'Não é o dono, conta inativa ou nível insuficiente (MARKETPLACE_PUBLICATION_NOT_ALLOWED)' }
        '404': { description: Não encontrado }
        '409': { description: Já publicado (MARKETPLACE_LISTING_ALREADY_PUBLISHED) }
        '422': { description: 'Campos obrigatórios ausentes (MARKETPLACE_LISTING_INCOMPLETE)' }

  /marketplace/listings/{listingId}/contact:
    post:
      tags: [Marketplace]
      summary: MRK-006 — Entrar em contato com o anunciante
      description: >
        201 quando abre a conversa; **200 quando reutiliza** uma conversa ativa
        entre as mesmas partes para o mesmo anúncio (BR-005 + INCONSISTENCIAS
        #9 — nunca 409, nunca duplicata).
      operationId: contactMarketplaceListingOwner
      parameters: [{ name: listingId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            example: { message: 'Olá! Você atende no sábado de manhã?' }
      responses:
        '201': { description: '{conversation, message, created: true}' }
        '200': { description: '{conversation, message, created: false} — conversa ativa reaproveitada' }
        '404': { description: 'Anúncio inexistente ou indisponível (MARKETPLACE_LISTING_UNAVAILABLE)' }
        '422': { description: 'Contato com o próprio anúncio (CANNOT_CONTACT_OWN_LISTING)' }

  # ── Service Request, Discovery & Matching (IP-003) ────────────────────────
  # Todas as rotas abaixo exigem autenticação e são SEMPRE privadas ao Trust
  # Member dono do pedido — não existe rota pública/@Public() aqui, ao
  # contrário de /marketplace/listings. Um identityId diferente do dono
  # recebe 404 (SERVICE_REQUEST_NOT_FOUND), nunca 403: o agregado não tem
  # visão pública alguma (privacidade — ver 02_SHARED_ENGINEERING_STANDARDS §7).
  /marketplace/service-requests:
    post:
      tags: [Marketplace]
      summary: IP-003 — Trust Member descreve uma necessidade de serviço
      description: >
        Nasce completo e já OPEN (não existe rascunho, ao contrário do MRK-001
        — este agregado nunca é publicamente navegável). `locationLabel` é
        texto livre e grosseiro ("Bairro, Cidade/UF"), o mesmo formato de
        `marketplace_listings.location`; não existe latitude/longitude
        precisa neste recurso (decisão de privacidade). `radiusKm` é uma
        preferência declarada — matching por raio geométrico fica para o
        IP-005: não por falta de qualquer coordenada de Partner no
        repositório (existem geotags de execução em campo em
        marketplace_order_execution_events, migration 0017), mas porque não
        existe um perfil de localização do Partner PRÉ-engajamento que
        sustente matching prospectivo hoje.
      operationId: createServiceRequest
      requestBody:
        required: true
        content:
          application/json:
            example:
              title: Preciso trocar uma torneira e consertar uma dobradiça
              description: A torneira da cozinha está vazando e a porta do quarto não fecha direito.
              category: HOME_REPAIRS
              locationLabel: Vila Mariana, São Paulo/SP
              radiusKm: 10
              urgency: THIS_WEEK
              budgetMinAmount: 50
              budgetMaxAmount: 300
      responses:
        '201': { description: Pedido criado em OPEN }
        '401': { description: Sem token (INVALID_TOKEN) }
        '422': { description: 'Categoria inexistente/inativa (MARKETPLACE_CATEGORY_NOT_FOUND) ou budgetMinAmount > budgetMaxAmount (SERVICE_REQUEST_INVALID)' }

  /marketplace/service-requests/mine:
    get:
      tags: [Marketplace]
      summary: Meus pedidos de serviço
      operationId: listMyServiceRequests
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: size, in: query, schema: { type: integer, default: 20, maximum: 50 } }
      responses: { '200': { description: Resumo paginado } }

  /marketplace/service-requests/{serviceRequestId}:
    get:
      tags: [Marketplace]
      summary: Detalhe do pedido — sempre privado ao dono
      operationId: getServiceRequest
      parameters: [{ name: serviceRequestId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Pedido completo (status EXPIRED é derivado de expiresAt, nunca gravado) }
        '404': { description: 'Inexistente ou pertence a outro Member (SERVICE_REQUEST_NOT_FOUND)' }

  /marketplace/service-requests/{serviceRequestId}/matches:
    get:
      tags: [Marketplace]
      summary: IP-003 — Descoberta determinística de Partners elegíveis (sem IA)
      description: >
        Reaproveita a mesma busca do MRK-004 (`MarketplaceListingRepository.search()`),
        filtrando por categoria + `locationLabel` (texto livre) + nível mínimo
        de confiança do pedido, ordenado por reputação (`sort=trust_score`).
        Nenhum ranking por IA/embedding; nenhuma distância geométrica é
        calculada (ver observação em `POST /marketplace/service-requests`).
      operationId: discoverServiceRequestMatches
      parameters:
        - { name: serviceRequestId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: size, in: query, schema: { type: integer, default: 20, maximum: 50 } }
      responses:
        '200': { description: 'Anúncios PUBLISHED elegíveis (shape do MRK-004) + bloco pagination; `alreadyEngaged` indica contato já feito' }
        '404': { description: 'Inexistente ou pertence a outro Member (SERVICE_REQUEST_NOT_FOUND)' }

  /marketplace/service-requests/{serviceRequestId}/engage:
    post:
      tags: [Marketplace]
      summary: IP-003 — Engaja um Partner elegível (liga o pedido à conversa já existente)
      description: >
        Reaproveita `POST /marketplace/listings/{listingId}/contact` (MRK-006)
        por baixo — cria ou reutiliza a conversa ativa entre as mesmas partes,
        exatamente com a mesma semântica de dedupe. 201 no primeiro
        engajamento com este anúncio; 200 ao reengajar (reaproveita a mesma
        conversa). Na primeira vez, o pedido transiciona OPEN -> MATCHED
        (idempotente: engajar outro Partner depois não é erro nem reserva
        exclusividade).
      operationId: engageServiceRequest
      parameters: [{ name: serviceRequestId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            example: { listingId: 019fe8f0-0000-7000-8000-000000000001, message: 'Olá! Vi que você atende na minha região, pode me ajudar?' }
      responses:
        '201': { description: '{engagement, conversation, message, created: true}' }
        '200': { description: '{engagement, conversation, message, created: false} — engajamento reaproveitado' }
        '404': { description: 'Pedido inexistente/de outro Member, ou anúncio indicado indisponível' }
        '409': { description: 'Pedido CLOSED/CANCELLED/EXPIRED não aceita novo engajamento (SERVICE_REQUEST_NOT_ENGAGEABLE)' }
        '422': { description: 'Engajar o próprio anúncio (CANNOT_CONTACT_OWN_LISTING, herdado do MRK-006)' }

  /marketplace/service-requests/{serviceRequestId}/offers:
    get:
      tags: [Marketplace]
      summary: IP-004 — Comparação lado a lado das propostas concorrentes deste pedido
      description: >
        Uma linha por Partner engajado (`ServiceRequestEngagement`, IP-003),
        cada um com a rodada VIVA da sua própria negociação (última entrada de
        `GET /marketplace/conversations/{id}/offers`, MRK-012 §6.2) — a
        máquina de estados de proposta/aceite (MRK-009..014) é lida, nunca
        alterada por esta rota. `pricingModel` nunca é convertido entre
        FIXED_PRICE e HOURLY: `amount` é sempre o valor literal da proposta
        (para HOURLY, o mínimo contratado já derivado por
        `calculateInitialHourlyAmount`, PACK-02 §4.2) e `estimatedTotalBasis`
        rotula explicitamente o que esse número significa
        (`FIXED_TOTAL` | `HOURLY_MINIMUM_COMMITMENT`). Sem ranking oculto/paid
        placement e sem vencedor automático (IP-004 §4): os itens vêm
        ordenados por `engagedAt` (ordem de contato). `hasOffer: false`
        significa que o Partner foi engajado mas ainda não existe proposta na
        conversa (MRK-009 BR-001: quem abre a negociação é sempre o
        comprador/Member). Aceitar uma proposta continua sendo
        `POST /marketplace/offers/{offerId}/accept` (MRK-013, intocado) — o
        aceite só encerra as concorrentes da MESMA negociação (BR-004); a
        proposta de outro Partner (outra conversa) permanece PENDING até o
        Member decidir por ela também.
      operationId: compareServiceRequestOffers
      parameters: [{ name: serviceRequestId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: '{serviceRequestId, serviceRequestStatus, items: [{engagementId, listingId, listingTitle, partner: {identityId, trustScore, trustLevel}, conversationId, conversationStatus, engagedAt, hasOffer, offer}]}' }
        '404': { description: 'Inexistente ou de outro Member (SERVICE_REQUEST_NOT_FOUND)' }

  /marketplace/service-requests/{serviceRequestId}/close:
    post:
      tags: [Marketplace]
      summary: Trust Member fecha o pedido (por exemplo, achou o Partner certo)
      operationId: closeServiceRequest
      parameters: [{ name: serviceRequestId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        content:
          application/json:
            example: { reason: 'Combinei com o profissional pela conversa.' }
      responses:
        '200': { description: 'CLOSED; publica ServiceRequest.Closed' }
        '404': { description: 'Inexistente ou de outro Member (SERVICE_REQUEST_NOT_FOUND)' }
        '409': { description: 'Pedido já é CLOSED/CANCELLED (SERVICE_REQUEST_INVALID_TRANSITION)' }

  /marketplace/service-requests/{serviceRequestId}/cancel:
    post:
      tags: [Marketplace]
      summary: Trust Member desiste do pedido (motivo obrigatório)
      operationId: cancelServiceRequest
      parameters: [{ name: serviceRequestId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            example: { reason: 'Resolvi contratar um conhecido.' }
      responses:
        '200': { description: 'CANCELLED; publica ServiceRequest.Cancelled' }
        '400': { description: 'reason ausente (VALIDATION_ERROR)' }
        '404': { description: 'Inexistente ou de outro Member (SERVICE_REQUEST_NOT_FOUND)' }
        '409': { description: 'Pedido já é CLOSED/CANCELLED (SERVICE_REQUEST_INVALID_TRANSITION)' }

  /marketplace/conversations:
    get:
      tags: [Marketplace]
      summary: MRK-007 — Minhas conversas (como comprador ou vendedor)
      operationId: listMarketplaceConversations
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: size, in: query, schema: { type: integer, default: 20, maximum: 50 } }
      responses:
        '200': { description: '[{conversationId, listingId, listingTitle, counterpartName, status, lastMessageAt, lastMessagePreview, unreadCount}] + pagination' }

  /marketplace/conversations/{conversationId}:
    get:
      tags: [Marketplace]
      summary: MRK-007 — Conversa + histórico de mensagens (só participantes)
      operationId: getMarketplaceConversation
      parameters:
        - { name: conversationId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: size, in: query, schema: { type: integer, default: 50, maximum: 100 } }
      responses:
        '200': { description: '{conversation, messages[], pagination}' }
        '403': { description: Não é participante (MARKETPLACE_CONVERSATION_FORBIDDEN) }
        '404': { description: Não encontrada (MARKETPLACE_CONVERSATION_NOT_FOUND) }

  /marketplace/conversations/{conversationId}/messages:
    post:
      tags: [Marketplace]
      summary: MRK-007 — Enviar mensagem (só participantes, só conversa OPEN)
      operationId: sendMarketplaceMessage
      parameters: [{ name: conversationId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            example: { message: 'Bom dia! Atendo sim, sábado às 8h.' }
      responses:
        '201': { description: 'Mensagem registrada (imutável); publica MarketplaceMessage.Sent' }
        '403': { description: Não é participante }
        '409': { description: Conversa encerrada (MARKETPLACE_CONVERSATION_CLOSED) }

  /marketplace/conversations/{conversationId}/read:
    patch:
      tags: [Marketplace]
      summary: MRK-007 — Marcar como lidas as mensagens recebidas
      operationId: markMarketplaceMessagesAsRead
      parameters: [{ name: conversationId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: '{messagesRead}; publica MarketplaceConversation.Read quando houver mudança' } }

  /marketplace/conversations/{conversationId}/close:
    post:
      tags: [Marketplace]
      summary: MRK-008 — Encerrar conversa (histórico preservado)
      operationId: closeMarketplaceConversation
      parameters: [{ name: conversationId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        content:
          application/json:
            example: { reason: 'Negociação concluída.' }
      responses:
        '200': { description: 'CLOSED + closedAt/closedBy; publica MarketplaceConversation.Closed' }
        '403': { description: Não é participante }
        '409': { description: Já encerrada (MARKETPLACE_CONVERSATION_ALREADY_CLOSED) }

  # ── Negociação (Módulo 7 — MRK-009..014 + o pedido do MRK-015) ────────────
  /marketplace/conversations/{conversationId}/offers:
    post:
      tags: [Marketplace]
      summary: MRK-009 — Enviar proposta (só o comprador da conversa)
      description: >
        Exige conversa OPEN e anúncio PUBLISHED. Uma proposta viva por
        negociação: com outra PENDING em aberto responde 409 — atualize, retire
        ou decida antes (INCONSISTENCIAS #34). Moeda omitida herda a do anúncio.
      operationId: createMarketplaceOffer
      parameters: [{ name: conversationId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            example:
              amount: 540
              quantity: 1
              expiresAt: '2026-08-17T23:59:59Z'
              notes: Posso pagar à vista.
      responses:
        '201': { description: 'Proposta PENDING; publica MarketplaceOffer.Created' }
        '403': { description: 'Não é o comprador da conversa (MARKETPLACE_OFFER_NOT_RECIPIENT)' }
        '404': { description: 'Conversa inexistente ou anúncio indisponível' }
        '409': { description: 'Conversa encerrada (MARKETPLACE_CONVERSATION_CLOSED) ou já há proposta viva (MARKETPLACE_OFFER_ALREADY_EXISTS)' }
        '422': { description: 'Valor/quantidade ≤ 0 ou validade no passado (MARKETPLACE_OFFER_INVALID)' }
    get:
      tags: [Marketplace]
      summary: MRK-012 — Histórico da negociação (cadeia de propostas)
      operationId: listMarketplaceOffers
      parameters: [{ name: conversationId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: 'Rodadas da mais antiga para a mais nova, com parentOfferId encadeado' }
        '403': { description: Não é participante }

  /marketplace/offers/{offerId}:
    get:
      tags: [Marketplace]
      summary: Consultar proposta (comprador ou vendedor)
      operationId: getMarketplaceOffer
      parameters: [{ name: offerId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: 'Proposta; `status` é o efetivo — PENDING vencida aparece como EXPIRED' }
        '403': { description: Não é participante }
        '404': { description: Não encontrada (MARKETPLACE_OFFER_NOT_FOUND) }
    put:
      tags: [Marketplace]
      summary: MRK-010 — Atualizar proposta pendente (só quem a criou)
      description: 'Campos alteráveis: amount, quantity, expiresAt, notes. Moeda e partes não mudam.'
      operationId: updateMarketplaceOffer
      parameters: [{ name: offerId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            example: { amount: 520 }
      responses:
        '200': { description: 'Atualizada; publica MarketplaceOffer.Updated com updatedFields' }
        '403': { description: Não foi quem propôs (MARKETPLACE_OFFER_FORBIDDEN) }
        '409': { description: 'Já decidida (MARKETPLACE_OFFER_ALREADY_RESOLVED) ou vencida (MARKETPLACE_OFFER_EXPIRED)' }

  /marketplace/offers/{offerId}/withdraw:
    post:
      tags: [Marketplace]
      summary: MRK-011 — Retirar proposta (só quem a criou)
      operationId: withdrawMarketplaceOffer
      parameters: [{ name: offerId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        content:
          application/json:
            example: { reason: Encontrei outra solução. }
      responses:
        '200': { description: 'WITHDRAWN com autor/momento/motivo; a proposta nunca é apagada' }
        '403': { description: Não foi quem propôs }
        '409': { description: Já decidida ou vencida }

  /marketplace/offers/{offerId}/counter:
    post:
      tags: [Marketplace]
      summary: MRK-012 — Contrapor (só quem RECEBEU a proposta)
      description: >
        A proposta recebida vira COUNTERED e nasce a rodada seguinte com
        `parentOfferId` apontando para ela. A moeda é herdada da negociação e
        quem decide passa a ser o outro lado. Sem limite de rodadas.
      operationId: counterMarketplaceOffer
      parameters: [{ name: offerId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            example:
              amount: 580
              expiresAt: '2026-08-15T23:59:59Z'
              notes: Consigo fechar nesse valor.
      responses:
        '201': { description: 'Contraoferta PENDING; publica MarketplaceOffer.Countered' }
        '403': { description: 'Quem propôs não contrapõe a si mesmo (MARKETPLACE_OFFER_NOT_RECIPIENT)' }
        '409': { description: Proposta já decidida ou vencida }

  /marketplace/offers/{offerId}/accept:
    post:
      tags: [Marketplace]
      summary: MRK-013 — Aceitar proposta (só quem a RECEBEU)
      description: >
        Pivô do marketplace, tudo em UMA transação: proposta → ACCEPTED, demais
        propostas vivas → CLOSED, anúncio → RESERVED e criação do
        MarketplaceOrder. Publica MarketplaceOffer.Accepted,
        MarketplaceListing.Reserved e MarketplaceOrder.Created.
      operationId: acceptMarketplaceOffer
      parameters: [{ name: offerId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200':
          description: Negociação convertida em pedido
          content:
            application/json:
              example:
                success: true
                data:
                  offer: { offerId: 019fe8f0-0000-7000-8000-000000000010, status: ACCEPTED }
                  order:
                    orderId: 019fe8f0-0000-7000-8000-000000000020
                    offerId: 019fe8f0-0000-7000-8000-000000000010
                    amount: 540
                    currency: BRL
                    status: CREATED
                  listingStatus: RESERVED
                  closedOfferIds: []
        '403': { description: Quem propôs não aceita a própria proposta }
        '409': { description: 'Proposta já decidida/vencida ou anúncio não reservável (MARKETPLACE_LISTING_NOT_AVAILABLE)' }

  /marketplace/offers/{offerId}/reject:
    post:
      tags: [Marketplace]
      summary: MRK-014 — Rejeitar proposta (só quem a RECEBEU)
      description: A conversa permanece aberta; uma nova rodada pode começar em seguida.
      operationId: rejectMarketplaceOffer
      parameters: [{ name: offerId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        content:
          application/json:
            example: { reason: Valor acima do orçamento. }
      responses:
        '200': { description: 'REJECTED; publica MarketplaceOffer.Rejected' }
        '403': { description: Não é o destinatário da proposta }
        '409': { description: Já decidida ou vencida }

  # ── Ciclo do pedido (Módulo 8 — MRK-015..022) ─────────────────────────────
  /marketplace/orders:
    get:
      tags: [Marketplace]
      summary: Meus pedidos (como comprador ou vendedor)
      description: 'Pedidos nascem apenas do aceite (MRK-015 BR-001): não há criação manual.'
      operationId: listMarketplaceOrders
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: size, in: query, schema: { type: integer, default: 20, maximum: 50 } }
      responses: { '200': { description: Pedidos + pagination } }

  /marketplace/orders/{orderId}:
    get:
      tags: [Marketplace]
      summary: MRK-016 — Consultar pedido (visão consolidada)
      description: >
        Traz status, **próxima ação esperada**, agendamento e a linha do tempo
        da transação (criação, agendamento, check-in, check-out, confirmação,
        cancelamento). Toda consulta é auditada (BR-005).
      operationId: getMarketplaceOrder
      parameters: [{ name: orderId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200':
          description: Pedido consolidado
          content:
            application/json:
              example:
                success: true
                data:
                  orderId: 019fe8f0-0000-7000-8000-000000000020
                  status: AWAITING_CUSTOMER_CONFIRMATION
                  nextAction: AWAITING_CUSTOMER_CONFIRMATION
                  amount: 1100
                  currency: BRL
                  actualDuration: 240
                  listingTitle: Pintura de apartamento com massa corrida
                  scheduling:
                    scheduledStart: '2026-08-11T12:00:00.000Z'
                    scheduledEnd: '2026-08-11T16:00:00.000Z'
                    estimatedDuration: 240
                    timezone: America/Sao_Paulo
                    status: ACTIVE
                  timeline:
                    - { type: ORDER_CREATED, occurredAt: '2026-08-10T10:00:00.000Z' }
                    - { type: SCHEDULED, occurredAt: '2026-08-10T10:05:00.000Z' }
                    - { type: CHECK_IN, occurredAt: '2026-08-11T12:00:00.000Z' }
                    - { type: CHECK_OUT, occurredAt: '2026-08-11T16:00:00.000Z' }
        '403': { description: Não é participante (MARKETPLACE_ORDER_FORBIDDEN) }
        '404': { description: Não encontrado (MARKETPLACE_ORDER_NOT_FOUND) }

  /marketplace/orders/{orderId}/schedule:
    post:
      tags: [Marketplace]
      summary: MRK-019 — Agendar o serviço
      description: >
        Válido em CREATED/AWAITING_SCHEDULING. O fim previsto é derivado do
        início + duração e a agenda do prestador é checada contra sobreposição
        (BR-004). Status vai para SCHEDULED.
      operationId: scheduleMarketplaceOrder
      parameters: [{ name: orderId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            example:
              scheduledStart: '2026-08-11T12:00:00Z'
              estimatedDuration: 240
              timezone: America/Sao_Paulo
      responses:
        '200': { description: 'SCHEDULED; publica MarketplaceOrder.Scheduled' }
        '409': { description: 'Agenda ocupada (MARKETPLACE_SCHEDULING_CONFLICT), fora da disponibilidade declarada (MARKETPLACE_SCHEDULING_OUTSIDE_AVAILABILITY) ou transição inválida' }
        '422': { description: 'Janela inválida (MARKETPLACE_INVALID_SCHEDULING_WINDOW)' }

  /marketplace/orders/{orderId}/reschedule:
    post:
      tags: [Marketplace]
      summary: IP-005 — Reagendar (troca a janela de um pedido já agendado)
      description: >
        Fecha o gap previsto desde o MVP (INCONSISTENCIAS #26: "se
        reagendamento entrar, trocar UNIQUE(order_id) por
        UNIQUE(order_id) WHERE status = 'ACTIVE'"). Válido só em SCHEDULED com
        execução ainda não iniciada (check-in não realizado); depois disso o
        caminho é disputa/cancelamento. A janela antiga não é apagada: vira
        uma linha `CANCELLED` com `cancelledReason` preenchido (distinguível
        de um cancelamento do pedido inteiro, que grava `null`). Motivo
        obrigatório, mesma regra de MRK-018 BR-003.
      operationId: rescheduleMarketplaceOrder
      parameters: [{ name: orderId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            example:
              scheduledStart: '2026-08-13T12:00:00Z'
              estimatedDuration: 240
              timezone: America/Sao_Paulo
              reason: Cliente pediu para adiar
      responses:
        '200': { description: 'SCHEDULED com a nova janela; publica MarketplaceOrder.Rescheduled' }
        '403': { description: Não é participante do pedido }
        '409': { description: 'Não reagendável (MARKETPLACE_ORDER_NOT_RESCHEDULABLE), sem agendamento ativo (MARKETPLACE_SCHEDULING_NOT_FOUND), conflito (MARKETPLACE_SCHEDULING_CONFLICT) ou fora da disponibilidade (MARKETPLACE_SCHEDULING_OUTSIDE_AVAILABILITY)' }
        '400': { description: 'reason ausente ou janela fora do formato aceito (VALIDATION_ERROR)' }

  /marketplace/orders/{orderId}/travel-status:
    get:
      tags: [Marketplace]
      summary: IP-005 — Status de deslocamento do Partner (leitura)
      description: >
        NOT_STARTED | EN_ROUTE | ARRIVED. Modelo de transição DECLARADA, nunca
        rastreamento contínuo de GPS — nenhuma coordenada é exposta aqui.
        Visível a ambos os participantes (visibilidade do Member sobre o
        progresso da chegada sem vazar localização precisa contínua).
      operationId: getMarketplaceOrderTravelStatus
      parameters: [{ name: orderId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Status de deslocamento corrente }
        '403': { description: Não é participante do pedido }

  /marketplace/orders/{orderId}/travel-status/en-route:
    post:
      tags: [Marketplace]
      summary: IP-005 — Partner declara "a caminho" + ETA
      description: >
        Só o prestador. `declaredEtaMinutes` é um número que o PRÓPRIO Partner
        informa — nenhum roteamento geográfico é computado nesta release
        (nenhum fornecedor de mapas está configurado; ver EtaEstimatorPort,
        que existe justamente para permitir trocar por um provedor real no
        futuro sem mudar nenhum contrato de API). Só se aplica a um pedido
        SCHEDULED cuja execução ainda não começou. Idempotente: redeclarar
        atualiza o ETA sem gerar uma nova transição de estado.
      operationId: declareMarketplaceOrderPartnerEnRoute
      parameters: [{ name: orderId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            example: { declaredEtaMinutes: 15 }
      responses:
        '200': { description: 'EN_ROUTE; publica MarketplaceOrder.PartnerEnRoute' }
        '403': { description: Não é o prestador }
        '409': { description: 'Não se aplica (MARKETPLACE_ORDER_TRAVEL_NOT_APPLICABLE)' }

  /marketplace/orders/{orderId}/travel-status/arrived:
    post:
      tags: [Marketplace]
      summary: IP-005 — Partner declara "cheguei"
      description: Só o prestador. Exige ter declarado EN_ROUTE antes; terminal.
      operationId: declareMarketplaceOrderPartnerArrived
      parameters: [{ name: orderId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: 'ARRIVED; publica MarketplaceOrder.PartnerArrived' }
        '403': { description: Não é o prestador }
        '409': { description: 'Transição inválida (MARKETPLACE_ORDER_TRAVEL_TRANSITION_INVALID) ou não se aplica (MARKETPLACE_ORDER_TRAVEL_NOT_APPLICABLE)' }

  /marketplace/partner-availability:
    put:
      tags: [Marketplace]
      summary: IP-005 — Declara a disponibilidade semanal do Partner (replace-all)
      description: >
        Substitui o conjunto INTEIRO de janelas do chamador (não é um patch
        incremental). Cada janela é `{dayOfWeek (0=domingo..6=sábado),
        startMinute, endMinute, timezone}`, um único dia, mínimo 30 minutos.
        Sem nenhuma janela declarada, o agendamento não sofre nenhuma
        restrição de disponibilidade (comportamento idêntico ao que já
        existia antes desta IP).
      operationId: setPartnerAvailability
      requestBody:
        required: true
        content:
          application/json:
            example:
              windows:
                - { dayOfWeek: 1, startMinute: 480, endMinute: 1080, timezone: America/Sao_Paulo }
                - { dayOfWeek: 3, startMinute: 480, endMinute: 1080, timezone: America/Sao_Paulo }
      responses:
        '200': { description: Conjunto de janelas persistido }
        '422': { description: 'Janela inválida ou sobreposta no mesmo dia (MARKETPLACE_PARTNER_AVAILABILITY_INVALID)' }

  /marketplace/partner-availability/mine:
    get:
      tags: [Marketplace]
      summary: IP-005 — Lista a disponibilidade declarada pelo chamador
      operationId: listMyPartnerAvailability
      responses:
        '200': { description: Janelas declaradas pelo chamador }

  /marketplace/orders/{orderId}/start:
    post:
      tags: [Marketplace]
      summary: MRK-020 — Check-in do prestador (inicia a execução)
      description: >
        Só o prestador. Geolocalização, endereço e observações são opcionais e
        informativos — nunca bloqueiam o início (BR-004). Status → IN_PROGRESS.
      operationId: startMarketplaceOrder
      parameters: [{ name: orderId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        content:
          application/json:
            example: { latitude: -23.5505, longitude: -46.6333, accuracy: 12.5, notes: Cheguei ao local. }
      responses:
        '200': { description: 'IN_PROGRESS; publica MarketplaceOrder.Started' }
        '403': { description: Não é o prestador }
        '409': { description: 'Pedido não está agendado (MARKETPLACE_ORDER_INVALID_TRANSITION)' }

  /marketplace/orders/{orderId}/complete:
    post:
      tags: [Marketplace]
      summary: MRK-021 — Check-out do prestador (conclui a execução)
      description: >
        Calcula a duração efetiva (check-in → check-out) e passa a bola ao
        cliente. Status → AWAITING_CUSTOMER_CONFIRMATION. O evento publicado é
        `MarketplaceOrder.ExecutionCompleted` (INCONSISTENCIAS #24 — check-out
        não é pedido concluído).
      operationId: completeMarketplaceOrderExecution
      parameters: [{ name: orderId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        content:
          application/json:
            example: { notes: Serviço finalizado, ambiente limpo. }
      responses:
        '200': { description: AWAITING_CUSTOMER_CONFIRMATION + actualDuration }
        '403': { description: Não é o prestador }
        '409': { description: Pedido não está em execução }

  /marketplace/orders/{orderId}/confirm-completion:
    post:
      tags: [Marketplace]
      summary: MRK-022 — Cliente confirma a conclusão
      description: >
        Só o comprador. **Não encerra o pedido** (BR-006): publica
        `MarketplaceOrder.CustomerConfirmed`, que dispara os processos
        obrigatórios — atualização do Trust Score (+40 para o prestador) e a
        transição automática para COMPLETED.
      operationId: confirmMarketplaceOrderCompletion
      parameters: [{ name: orderId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        content:
          application/json:
            example: { comments: Ficou impecável! }
      responses:
        '200': { description: 'CUSTOMER_CONFIRMED (COMPLETED chega logo depois, de forma assíncrona)' }
        '403': { description: Só o cliente confirma }
        '409': { description: Pedido não está aguardando confirmação }

  /marketplace/orders/{orderId}/cancel:
    post:
      tags: [Marketplace]
      summary: MRK-018 — Cancelar pedido (motivo obrigatório)
      description: >
        Permitido em CREATED, AWAITING_SCHEDULING, SCHEDULED e
        AWAITING_EXECUTION. A partir de IN_PROGRESS exige disputa ou revisão
        administrativa (BR-002). O cancelamento devolve o anúncio para
        PUBLISHED (INCONSISTENCIAS #12) e penaliza quem cancelou no Trust Score.
        **IP-008**: também tem consequência financeira automática, sem taxa/
        multa (nenhuma política de cancelamento está configurada em lugar
        nenhum do baseline — o único default seguro é reembolso integral do
        que foi efetivamente capturado, sem desconto): dinheiro só autorizado
        (nunca custodiado) é anulado no provedor; dinheiro em custódia
        (tranche original e/ou tranches de Change Order aprovado) é
        reembolsado por inteiro — ver `MarketplaceOrder.Cancelled` no
        `event-catalog.md` e `GET /payments/by-order/{orderId}`'s `refunds[]`.
      operationId: cancelMarketplaceOrder
      parameters: [{ name: orderId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            example: { reason: Mudança de planos do cliente. }
      responses:
        '200': { description: 'CANCELLED; publica MarketplaceOrder.Cancelled' }
        '400': { description: Motivo ausente (VALIDATION_ERROR) }
        '403': { description: Não é participante }
        '409': { description: 'Estado não admite cancelamento (MARKETPLACE_ORDER_CANCELLATION_NOT_ALLOWED)' }

  # ── PACK-03 — Trust Change Order & Time Billing ──────────────────────────
  /marketplace/orders/{orderId}/change-orders:
    post:
      tags: [Marketplace]
      summary: PACK-03 §7 — Cria um Trust Change Order (rascunho)
      description: >
        Só o **prestador** (Trust Partner) propõe aumento; o rascunho não altera
        valor autorizado nenhum. Em `ADDITIONAL_TIME` o valor do serviço é
        **derivado** da taxa/hora congelada no contrato — enviar
        `serviceDeltaAmount` nesse tipo é 422. Minutos precisam ser múltiplo
        exato do `billingIncrementMinutes` congelado no contrato (§7.1).
      operationId: createTrustChangeOrder
      parameters: [{ name: orderId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, reason]
              properties:
                type: { type: string, enum: [ADDITIONAL_TIME, SCOPE_CHANGE, MATERIAL, MIXED] }
                additionalMinutes: { type: integer, description: Só em ADDITIONAL_TIME; múltiplo do incremento congelado }
                serviceDeltaAmount: { type: number, description: Não aceito em ADDITIONAL_TIME (é derivado) }
                materialCostDeltaAmount: { type: number, description: Pass-through — 0% de Trust Fee }
                materialMarkupDeltaAmount: { type: number, description: Fee-eligible }
                reason: { type: string }
                description: { type: string }
                expiresAt: { type: string, format: date-time }
            example: { type: ADDITIONAL_TIME, additionalMinutes: 30, reason: A fiação estava mais danificada do que o previsto. }
      responses:
        '201': { description: Change Order em DRAFT }
        '403': { description: Não é o prestador do contrato }
        '409': { description: Pedido em estado que não aceita mudança comercial }
        '422': { description: Minutos fora do incremento, delta zero/negativo ou tipo inconsistente }
    get:
      tags: [Marketplace]
      summary: PACK-03 §21 — Lista as mudanças comerciais do contrato
      description: >
        Comprador e vendedor. A economia interna do prestador (base da fee, taxa
        e líquido) só aparece para o prestador (§15).
      operationId: listTrustChangeOrders
      parameters: [{ name: orderId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Lista de Change Orders }
        '403': { description: Não é participante do pedido }

  /marketplace/change-orders/{changeOrderId}:
    get:
      tags: [Marketplace]
      summary: PACK-03 §21 — Detalhe de um Trust Change Order
      operationId: getTrustChangeOrder
      parameters: [{ name: changeOrderId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Change Order }
        '403': { description: Não é participante do pedido }
        '404': { description: Change Order inexistente }

  /marketplace/change-orders/{changeOrderId}/submit:
    post:
      tags: [Marketplace]
      summary: PACK-03 §6.1 — Submete a mudança à aprovação do cliente
      description: Status → `PENDING_MEMBER_APPROVAL`. Publica `TrustChangeOrder.Submitted`.
      operationId: submitTrustChangeOrder
      parameters: [{ name: changeOrderId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: PENDING_MEMBER_APPROVAL }
        '403': { description: Não é quem propôs }
        '409': { description: Já submetida, decidida ou vencida }

  /marketplace/change-orders/{changeOrderId}/approve:
    post:
      tags: [Marketplace]
      summary: PACK-03 §6.1/§12 — Cliente aprova a mudança
      description: >
        **Só o cliente** (Trust Member). É o único ponto em que o valor
        autorizado do contrato sobe. Terminal e imutável: aprovar duas vezes
        devolve 409 e o delta entra uma única vez (§19). A custódia do PACK-01
        **não** é alterada — o delta fica autorizado e fora da custódia (§9).
      operationId: approveTrustChangeOrder
      parameters: [{ name: changeOrderId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: APPROVED }
        '403': { description: Não é o cliente do contrato }
        '409': { description: Já decidida ou vencida }

  /marketplace/change-orders/{changeOrderId}/reject:
    post:
      tags: [Marketplace]
      summary: PACK-03 §6.1 — Cliente rejeita a mudança
      description: Terminal. Nada muda no valor nem no tempo autorizado.
      operationId: rejectTrustChangeOrder
      parameters: [{ name: changeOrderId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        content:
          application/json:
            example: { reason: Não autorizo esse valor adicional. }
      responses:
        '200': { description: REJECTED }
        '403': { description: Não é o cliente do contrato }
        '409': { description: Já decidida ou vencida }

  /marketplace/change-orders/{changeOrderId}/cancel:
    post:
      tags: [Marketplace]
      summary: PACK-03 §6.1 — Prestador retira a mudança antes da decisão
      operationId: cancelTrustChangeOrder
      parameters: [{ name: changeOrderId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: CANCELLED }
        '403': { description: Não é quem propôs }
        '409': { description: Já decidida }

  /marketplace/change-orders/{changeOrderId}/evidences:
    post:
      tags: [Marketplace]
      summary: PACK-03 §13 — Anexa evidência à mudança (multipart)
      description: >
        Campos `type` (PHOTO/RECEIPT/QUOTE/DOCUMENT/OTHER) e arquivo `file`.
        Só o proponente, e só antes da decisão. Reaproveita a abstração de
        storage do shared kernel, com bucket e tabela próprios — a evidência de
        Change Order **não** vai para `verification_evidences` (§13).
      operationId: submitTrustChangeOrderEvidence
      parameters: [{ name: changeOrderId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [type, file]
              properties:
                type: { type: string, enum: [PHOTO, RECEIPT, QUOTE, DOCUMENT, OTHER] }
                file: { type: string, format: binary }
      responses:
        '201': { description: Evidência anexada }
        '403': { description: Não é quem propôs }
        '409': { description: Change Order já decidida }
        '413': { description: Arquivo acima do limite }
        '415': { description: Tipo de arquivo não permitido }

  /marketplace/orders/{orderId}/pause:
    post:
      tags: [Marketplace]
      summary: PACK-03 §10.2 — Trust Pause (interrupção não faturável)
      description: >
        Só o prestador, e só com a sessão ACTIVE. Uma pausa aberta por vez —
        garantido por índice parcial no banco (§19). Publica
        `ServiceExecution.Paused`.
      operationId: pauseServiceExecution
      parameters: [{ name: orderId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reasonCode]
              properties:
                reasonCode: { type: string, enum: [PERSONAL_BREAK, PERSONAL_CALL, MEAL, OTHER_NON_BILLABLE] }
                note: { type: string }
            example: { reasonCode: MEAL, note: Parada para almoço }
      responses:
        '200': { description: Sessão PAUSED }
        '403': { description: Não é o prestador }
        '409': { description: Sessão inexistente ou fora de ACTIVE }

  /marketplace/orders/{orderId}/resume:
    post:
      tags: [Marketplace]
      summary: PACK-03 §10.3 — Trust Resume
      description: Fecha a pausa aberta e devolve a sessão para ACTIVE. Publica `ServiceExecution.Resumed`.
      operationId: resumeServiceExecution
      parameters: [{ name: orderId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Sessão ACTIVE }
        '403': { description: Não é o prestador }
        '409': { description: Nenhuma pausa aberta }

  /marketplace/orders/{orderId}/service-summary:
    get:
      tags: [Marketplace]
      summary: PACK-03 §15 — Service Summary (o que contratei + o que aprovei = total)
      description: >
        Reconcilia o snapshot inicial imutável do PACK-02 com os Change Orders
        aprovados, e separa tempo decorrido, pausado, ativo e **faturável**.
        `amountInCustody` / `amountAuthorizedNotInCustody` explicitam o recorte
        do §9: a custódia segura o valor da contratação, e o que foi aprovado
        depois está autorizado mas não custodiado. Trust Fee e líquido do
        prestador só aparecem na visão do prestador.
        **Nota (IP-007)**: estes dois campos continuam sendo o corte
        **comercial-only** (quanto o Member aprovou), calculado sem consultar o
        módulo Payments — não foram alterados por esta IP. Quando existe pelo
        menos um Change Order aprovado, `GET /payments/by-order/{orderId}`'s
        `custodySummary` é a fonte que sabe, de fato, quanto entrou em custódia
        tranche por tranche (inclusive quando o gateway recusou a autorização
        incremental de um Change Order já aprovado pelo Member).
      operationId: getServiceSummary
      parameters: [{ name: orderId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Resumo do serviço }
        '403': { description: Não é participante do pedido }
        '422': { description: Pedido sem snapshot comercial (anterior ao PACK-02) }

  # ── IP-006 — Field Execution & Trust Evidence Hardening ───────────────────
  /marketplace/orders/{orderId}/execution-evidences:
    post:
      tags: [Marketplace]
      summary: IP-006 — Trust Evidence de execução (foto opcional antes/depois, multipart)
      description: >
        Campos `type` (BEFORE/AFTER/OTHER) e arquivo `file`. Só o Trust
        Partner do pedido. SEMPRE opcional: nenhuma outra operação de
        execução (check-in/pausa/check-out) exige evidência. Amarrada
        diretamente ao pedido (não à sessão), reaproveita a mesma abstração
        de storage do shared kernel com bucket e tabela próprios
        (`service-execution-evidences` / `service_execution_evidences`) —
        não vai para `verification_evidences` nem
        `trust_change_order_evidences`.
      operationId: submitServiceExecutionEvidence
      parameters: [{ name: orderId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [type, file]
              properties:
                type: { type: string, enum: [BEFORE, AFTER, OTHER] }
                file: { type: string, format: binary }
      responses:
        '201': { description: Evidência anexada }
        '403': { description: Não é o Trust Partner do pedido }
        '413': { description: Arquivo acima do limite }
        '415': { description: Tipo de arquivo não permitido }
    get:
      tags: [Marketplace]
      summary: IP-006 — Lista Trust Evidence de execução (privada aos participantes)
      description: >
        Nunca pública: só Member e Partner do pedido (mesma checagem de
        `loadForParticipant` do Service Summary). Um terceiro recebe 403.
      operationId: listServiceExecutionEvidences
      parameters: [{ name: orderId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Lista de evidências (pode ser vazia) }
        '403': { description: Não é participante do pedido }

  /marketplace/orders/{orderId}/service-notes:
    post:
      tags: [Marketplace]
      summary: IP-006 — Nota de serviço do Partner
      description: >
        Texto livre sobre o que foi feito, separado do fluxo de
        disputa/avaliação (que já existe em outro módulo). Só o Trust
        Partner escreve; append-only.
      operationId: addServiceNote
      parameters: [{ name: orderId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, maxLength: 2000 }
            example: { body: Troquei o disjuntor e testei a instalação. }
      responses:
        '201': { description: Nota registrada }
        '403': { description: Não é o Trust Partner do pedido }
    get:
      tags: [Marketplace]
      summary: IP-006 — Lista notas de serviço (privada aos participantes)
      operationId: listServiceNotes
      parameters: [{ name: orderId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Lista de notas (pode ser vazia) }
        '403': { description: Não é participante do pedido }

  # ── Disputas e avaliações (Módulo 9 — MRK-023..025) ───────────────────────
  /marketplace/review-catalog:
    get:
      tags: [Marketplace]
      summary: Catálogos de disputa e avaliação
      operationId: getMarketplaceReviewCatalog
      responses:
        '200': { description: '{disputeCategories[], decisionTypes[], reviewCriteria[]}' }

  /marketplace/orders/{orderId}/disputes:
    post:
      tags: [Marketplace]
      summary: MRK-023 — Abrir disputa (comprador ou vendedor)
      description: >
        Uma disputa ativa por pedido (BR-002). O pedido vai para DISPUTE_OPEN e
        nenhuma evidência já registrada é alterada (BR-006).
      operationId: openMarketplaceDispute
      parameters: [{ name: orderId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            example:
              category: SERVICE_PARTIALLY_EXECUTED
              description: O prestador montou apenas o guarda-roupa e foi embora.
      responses:
        '201': { description: 'Disputa OPEN; publica MarketplaceDispute.Opened' }
        '403': { description: Não é participante do pedido }
        '409': { description: 'Já existe disputa ativa (MARKETPLACE_DISPUTE_ALREADY_OPEN) ou o estado do pedido não admite disputa' }
        '422': { description: Categoria/descrição inválidas (MARKETPLACE_DISPUTE_INVALID) }
    get:
      tags: [Marketplace]
      summary: Disputas de um pedido (participantes)
      operationId: listMarketplaceOrderDisputes
      parameters: [{ name: orderId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: Disputas com a decisão, quando houver } }

  /marketplace/disputes/{disputeId}:
    get:
      tags: [Marketplace]
      summary: Consultar disputa (participantes ou ADMIN)
      operationId: getMarketplaceDispute
      parameters: [{ name: disputeId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Disputa + decisão }
        '403': { description: Não é participante nem admin }
        '404': { description: Não encontrada (MARKETPLACE_DISPUTE_NOT_FOUND) }

  /marketplace/disputes/{disputeId}/resolve:
    post:
      tags: [Marketplace]
      summary: MRK-024 — Decidir a disputa (ADMIN/mediador)
      description: >
        A decisão é **definitiva** (BR-006): disputa → RESOLVED e pedido →
        DISPUTE_RESOLVED. `UPHELD` e `PARTIALLY_UPHELD` reconhecem culpa da parte
        reclamada e viram penalidade no Trust Score; `REJECTED`, `SETTLED` e
        `CANCELLED` não penalizam ninguém.
        **IP-008**: `refundAmount` (reais, opcional) é a consequência
        FINANCEIRA explícita da decisão — o valor que o administrador decide
        devolver ao comprador, digitado por ele, nunca calculado a partir de
        `decisionType` (não existe uma tabela "UPHELD = 100%" aprovada em
        nenhum documento de produto). Omitido/zero = decisão sem reembolso.
        Limitado aqui só por sanidade (não pode exceder o valor contratado do
        pedido, `422 MARKETPLACE_DISPUTE_INVALID`); o limite AUTORITATIVO
        (nunca excede o saldo realmente reembolsável, incluindo reembolsos já
        feitos) é aplicado do lado do Payments quando `MarketplaceDispute.Resolved`
        é consumido — o reembolso em si é assíncrono, não parte desta resposta.
      operationId: resolveMarketplaceDispute
      parameters: [{ name: disputeId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            example:
              decisionType: PARTIALLY_UPHELD
              justification: As fotos enviadas confirmam execução parcial; reembolso parcial arbitrado.
              refundAmount: 150
      responses:
        '200': { description: 'RESOLVED; publica MarketplaceDispute.Resolved (com refundAmount, quando houver)' }
        '403': { description: Não é admin (ADMIN_REQUIRED) }
        '409': { description: 'Disputa já decidida (MARKETPLACE_DISPUTE_ALREADY_RESOLVED)' }
        '422': { description: 'refundAmount negativo ou maior que o valor contratado do pedido (MARKETPLACE_DISPUTE_INVALID)' }

  /admin/marketplace/disputes:
    get:
      tags: [Marketplace]
      summary: MRK-024 — Fila de disputas ativas (ADMIN)
      operationId: listActiveMarketplaceDisputes
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: size, in: query, schema: { type: integer, default: 20, maximum: 50 } }
      responses: { '200': { description: Disputas OPEN/IN_ANALYSIS/MEDIATION + pagination } }

  /marketplace/orders/{orderId}/reviews:
    post:
      tags: [Marketplace]
      summary: MRK-025 — Avaliar a transação
      description: >
        Só participantes (BR-001), uma vez por pessoa (BR-002) e só depois de
        COMPLETED, CLOSED ou DISPUTE_RESOLVED (BR-003). A nota geral (1–5) é o
        único campo obrigatório. **Alimenta o Trust Score de quem foi avaliado**:
        4–5 → +30, 3 → +5, 1–2 → −30.
      operationId: reviewMarketplaceTransaction
      parameters: [{ name: orderId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            example:
              overallScore: 5
              recommended: true
              comment: Montou tudo em duas horas e deixou o quarto limpo.
              scores: { quality: 5, punctuality: 5, communication: 4 }
      responses:
        '201': { description: 'Avaliação registrada (imutável); publica MarketplaceReview.Created' }
        '403': { description: Não é participante do pedido }
        '409': { description: 'Já avaliou (MARKETPLACE_REVIEW_ALREADY_EXISTS) ou pedido ainda não avaliável (MARKETPLACE_REVIEW_NOT_ALLOWED)' }
        '422': { description: Nota fora da escala 1–5 (MARKETPLACE_REVIEW_INVALID) }
    get:
      tags: [Marketplace]
      summary: Avaliações de um pedido (participantes)
      operationId: listMarketplaceOrderReviews
      parameters: [{ name: orderId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: Avaliações das duas partes } }

  /marketplace/reviews/received:
    get:
      tags: [Marketplace]
      summary: Avaliações que recebi
      operationId: listReceivedMarketplaceReviews
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: size, in: query, schema: { type: integer, default: 20, maximum: 50 } }
      responses: { '200': { description: Avaliações recebidas + pagination } }

  /marketplace/reviews/summary:
    get:
      tags: [Marketplace]
      summary: Minha reputação transacional consolidada
      operationId: getMarketplaceReviewSummary
      responses:
        '200': { description: '{totalReviews, averageScore, recommendationRate}' }

  # ── Notificações (NTF-001) ────────────────────────────────────────────────
  /notifications:
    get:
      tags: [Notification]
      summary: Meus avisos in-app
      description: >
        Projeção de eventos de domínio. Não existe endpoint de criação: todo
        aviso nasce de um evento consumido do outbox. IP-013 acrescenta
        `channel`/`deliveryStatus` (provider-ready: hoje sempre
        `IN_APP`/`DELIVERED` — a criação do aviso JÁ É a entrega; `EMAIL`/
        `PUSH`/`PENDING`/`FAILED` existem para um adapter futuro, nenhum
        provedor de e-mail/push é chamado por este módulo hoje).
      operationId: listNotifications
      parameters:
        - { name: onlyUnread, in: query, schema: { type: string, enum: ['true', 'false'] } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: size, in: query, schema: { type: integer, default: 20, maximum: 50 } }
      responses:
        '200':
          description: Avisos + pagination
          content:
            application/json:
              example:
                success: true
                data:
                  - notificationId: 019fe8f0-0000-7000-8000-000000000030
                    type: OFFER_RECEIVED
                    title: Você recebeu uma proposta
                    body: 'Proposta de R$ 220,00. Aceite, recuse ou faça uma contraproposta.'
                    resourceType: MarketplaceConversation
                    resourceId: 019fe8f0-0000-7000-8000-0000000000f1
                    read: false
                    channel: IN_APP
                    deliveryStatus: DELIVERED
                    createdAt: '2026-08-10T18:00:00.000Z'
                pagination: { page: 1, pageSize: 20, totalItems: 1, totalPages: 1 }

  /notifications/unread-count:
    get:
      tags: [Notification]
      summary: Contador de não lidas (sininho)
      operationId: getUnreadNotificationCount
      responses: { '200': { description: '{unread: number}' } }

  /notifications/{notificationId}/read:
    patch:
      tags: [Notification]
      summary: Marcar aviso como lido
      operationId: markNotificationAsRead
      parameters: [{ name: notificationId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: '{read: true}' }
        '404': { description: 'Inexistente, de outro usuário ou já lida (NOTIFICATION_NOT_FOUND)' }

  /notifications/read-all:
    patch:
      tags: [Notification]
      summary: Marcar todos os avisos como lidos
      operationId: markAllNotificationsAsRead
      responses: { '200': { description: '{updated: number}' } }

  # ── Pagamentos (PAY-001..002) ─────────────────────────────────────────────
  /payments:
    get:
      tags: [Payment]
      summary: Meus pagamentos (como comprador ou vendedor)
      operationId: listMyPayments
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: size, in: query, schema: { type: integer, default: 20, maximum: 50 } }
      responses: { '200': { description: Pagamentos + pagination } }

  /payments/by-order/{orderId}:
    get:
      tags: [Payment]
      summary: Pagamento de um pedido
      description: >
        Pagamentos nascem do aceite da proposta (PAY-001): não há criação
        manual. IP-007: quando o pedido tem pelo menos um Trust Change Order
        aprovado, a resposta ganha o campo aditivo `custodySummary`
        (`{currency, originalAmount, originalCustodyStatus,
        totalCommerciallyAuthorized, totalHeld, amountAuthorizedNotInCustody,
        incrementalTranches[]}`) — resolve o gap `amountAuthorizedNotInCustody`
        autorreportado pelo PACK-03 (§9.1): agora é um valor computável, não
        apenas o corte comercial-only do Service Summary do Marketplace.
        `incrementalTranches[]` lista cada Change Order aprovado com sua
        autorização incremental (`changeOrderId`, `incrementalAuthorizationId`,
        `amount`, `authorizationStatus`, `custodyStatus` — `null` quando o
        gateway recusou e nenhuma custódia chegou a existir). Campo omitido
        (não `null`/vazio) em pedidos sem nenhum Change Order aprovado.
        **IP-008**: `refunds[]` é SEMPRE presente (pode ser `[]`) — o
        histórico completo de reembolsos deste Payment (PAY-006), mais
        recente primeiro: `{refundId, amount, currency, reason, reasonDetail,
        requestedBy, disputeId, status, providerRefundId, requestedAt,
        completedAt}`. Não existe endpoint para CRIAR um reembolso (PAY-006
        §8: só processos internos/administrativos autorizados o disparam —
        cancelamento antes da execução e resolução de disputa com valor
        decidido, ver `event-catalog.md`); esta lista é só leitura/auditoria.
      operationId: getPaymentByOrder
      parameters: [{ name: orderId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200':
          description: Pagamento + histórico de tentativas de autorização + reembolsos + resumo de custódia (IP-007, quando aplicável)
          content:
            application/json:
              example:
                success: true
                data:
                  paymentId: 019fe8f0-0000-7000-8000-000000000040
                  status: FUNDS_IN_CUSTODY
                  amount: 150
                  authorizations: []
                  refunds: []
                  custodySummary:
                    currency: BRL
                    originalAmount: 150
                    originalCustodyStatus: IN_CUSTODY
                    totalCommerciallyAuthorized: 220.5
                    totalHeld: 220.5
                    amountAuthorizedNotInCustody: 0
                    incrementalTranches:
                      - changeOrderId: 019fe8f0-0000-7000-8000-0000000000c1
                        incrementalAuthorizationId: 019fe8f0-0000-7000-8000-0000000000c2
                        amount: 70.5
                        authorizationStatus: APPROVED
                        custodyStatus: IN_CUSTODY
        '403': { description: Não é participante (PAYMENT_FORBIDDEN) }
        '404': { description: Sem pagamento para este pedido (PAYMENT_NOT_FOUND) }

  /payments/{paymentId}:
    get:
      tags: [Payment]
      summary: Consultar pagamento (comprador ou vendedor)
      description: >
        IP-007: mesmo campo aditivo `custodySummary` de
        `/payments/by-order/{orderId}` — ver descrição lá.
      operationId: getPayment
      parameters: [{ name: paymentId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Pagamento + autorizações + resumo de custódia (IP-007, quando aplicável) }
        '403': { description: Não é participante }
        '404': { description: Não encontrado }

  /payments/{paymentId}/authorize:
    post:
      tags: [Payment]
      summary: PAY-002 — Autorizar pagamento (só o comprador)
      description: >
        Envie o header **Idempotency-Key**: é ele que impede cobrança dupla em
        clique duplo ou retry de rede (PAY-ARCH-001 §9). Repetir com a mesma
        chave devolve a autorização anterior com `replayed: true`, sem chamar o
        provedor. Responde 200 mesmo em recusa — quem diz se o dinheiro passou é
        o campo `authorized`. O instrumento vem TOKENIZADO; a API nunca recebe
        número de cartão ou CVV.
      operationId: authorizePayment
      parameters:
        - { name: paymentId, in: path, required: true, schema: { type: string, format: uuid } }
        - name: Idempotency-Key
          in: header
          required: false
          schema: { type: string, maxLength: 120 }
          description: Sem ela, cada requisição é uma tentativa nova de cobrança.
      requestBody:
        content:
          application/json:
            example: { paymentMethodToken: tok_sandbox_visa }
      responses:
        '200':
          description: Tentativa processada
          content:
            application/json:
              example:
                success: true
                data:
                  authorized: true
                  replayed: false
                  payment: { paymentId: 019fe8f0-0000-7000-8000-000000000040, status: AUTHORIZED, paymentProviderId: sandbox }
                  authorization: { authorizationId: 019fe8f0-0000-7000-8000-000000000041, status: APPROVED, authorizedAmount: 2400 }
        '403': { description: 'Não é o comprador (PAYMENT_FORBIDDEN)' }
        '404': { description: Pagamento não encontrado }
        '409': { description: 'Estado não permite autorizar (PAYMENT_INVALID_TRANSITION)' }
        '502': { description: 'Falha do provedor (PAYMENT_GATEWAY_ERROR)' }

  /privacy/requests:
    post:
      tags: [Privacy]
      summary: IP-021 — Solicitar exportação ou exclusão dos próprios dados (LGPD art. 18)
      description: >
        Sempre auto-serviço, escopado ao token do próprio titular (nenhuma rota
        administrativa em nome de outra Identity nesta fundação). Processado de
        forma SÍNCRONA: a resposta já vem com o resultado final.

        `DATA_EXPORT` devolve um retrato dos dados do titular em
        `exportedData` — NÃO é persistido (privacy-by-design: menos cópias de
        PII em repouso); não é re-baixável depois via GET.

        `DATA_DELETION` anonimiza `identities`/`trust_passports` (nome,
        e-mail, telefone, endereço) e revoga todas as sessões — NUNCA apaga
        `payments`/`trust_custodies`/`audit_logs`/eventos de execução (só
        referenciam a Identity por UUID, nunca guardam PII denormalizada).
        Bloqueada (mas registrada como `REJECTED`, não como erro) enquanto a
        Identity tiver pedido/custódia/pedido de serviço NÃO-terminal — trava
        de engenharia para proteger uma máquina de estados em andamento, não
        uma alegação jurídica de retenção.
      operationId: createPrivacyRequest
      requestBody:
        required: true
        content:
          application/json:
            example: { type: DATA_DELETION }
      responses:
        '201':
          description: Solicitação processada (ver `status`/`rejectionReason` no corpo)
          content:
            application/json:
              examples:
                exportCompleted:
                  value:
                    success: true
                    data:
                      id: '019fe415-6318-7bfb-a184-3f47c3f0b7e2'
                      type: DATA_EXPORT
                      status: COMPLETED
                      requestedAt: '2026-09-16T10:00:00.000Z'
                      completedAt: '2026-09-16T10:00:01.000Z'
                      rejectionReason: null
                      resultSummary: { verifications: 1, orders: 2, payments: 2, reviewsReceived: 1, serviceRequests: 0, legalConsents: 1 }
                      exportedData: { identity: { fullName: John Doe, email: john@email.com } }
                deletionRejected:
                  value:
                    success: true
                    data:
                      id: '019fe415-6318-7bfb-a184-3f47c3f0b7e3'
                      type: DATA_DELETION
                      status: REJECTED
                      requestedAt: '2026-09-16T10:00:00.000Z'
                      completedAt: '2026-09-16T10:00:00.000Z'
                      rejectionReason: ACTIVE_ORDERS
                      resultSummary: null
        '400': { description: 'type ausente/fora do catálogo (VALIDATION_ERROR)' }
        '401': { description: Sem token ou token inválido/expirado (INVALID_TOKEN) }
    get:
      tags: [Privacy]
      summary: IP-021 — Listar as próprias solicitações de privacidade
      operationId: listMyPrivacyRequests
      responses:
        '200':
          description: Solicitações do próprio titular, mais recentes primeiro
        '401': { description: Sem token ou token inválido/expirado (INVALID_TOKEN) }

  /privacy/requests/{requestId}:
    get:
      tags: [Privacy]
      summary: IP-021 — Consultar uma solicitação de privacidade
      description: Dono apenas — nenhuma visão administrativa nesta fundação (403 se não for o titular).
      operationId: getPrivacyRequest
      parameters:
        - { name: requestId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Solicitação encontrada }
        '401': { description: Sem token ou token inválido/expirado (INVALID_TOKEN) }
        '403': { description: 'Não é o titular (PRIVACY_REQUEST_ACCESS_DENIED)' }
        '404': { description: 'Solicitação não encontrada (PRIVACY_REQUEST_NOT_FOUND)' }

  /admin/analytics/overview:
    get:
      tags: [Analytics]
      summary: IP-020 — Funil, conversão, desfechos e pagamentos (ADMIN)
      description: >
        Agregação READ-ONLY, calculada sob demanda direto das tabelas
        operacionais (nenhum contador paralelo) — ver
        `apps/api/src/modules/analytics/domain/metrics-definitions.ts` para a
        fórmula exata de cada campo e o(s) evento(s) de origem no catálogo.
        Toda resposta é agregada (contagens/somas/taxas); nunca uma linha
        identificável por pessoa.
      operationId: getAnalyticsOverview
      parameters:
        - { name: from, in: query, required: false, schema: { type: string, format: date-time }, description: 'Default: 30 dias antes de `to`.' }
        - { name: to, in: query, required: false, schema: { type: string, format: date-time }, description: 'Default: agora.' }
      responses:
        '200':
          content:
            application/json:
              example:
                success: true
                data:
                  range: { from: '2026-08-17T00:00:00.000Z', to: '2026-09-16T00:00:00.000Z' }
                  funnel:
                    requestsCreated: 42
                    requestsMatched: 30
                    offersCreated: 55
                    ordersCreated: 28
                    executionCompleted: 22
                    customerConfirmed: 20
                    paymentsReleased: 19
                    grossOrderValueCents: 1520000
                    releasedCustodyValueCents: 1420000
                  conversion:
                    requestToMatch: 0.7143
                    offerToOrder: 0.5091
                    orderToExecution: 0.7857
                    executionToConfirmation: 0.9091
                    confirmationToPayment: 0.95
                  outcomes: { ordersCreated: 28, completionRate: 0.7143, cancellationRate: 0.0714, disputeRate: 0.0357 }
                  payments: { authorizationsAttempted: 30, authorizationsApproved: 28, paymentSuccessRate: 0.9333 }
                  timing: { avgTimeToFirstOfferMinutes: 42.5, avgPartnerResponseMinutes: 18.2 }
        '400': { description: '`from` posterior a `to` (VALIDATION_ERROR)' }
        '401': { description: Sem token ou token inválido/expirado (INVALID_TOKEN) }
        '403': { description: ADMIN_REQUIRED }

  /admin/analytics/trust-adoption:
    get:
      tags: [Analytics]
      summary: IP-020 — Adoção de Trust Passport, nível e verificação (ADMIN)
      description: Snapshot do estado ATUAL (não um período) — sempre agregado, nunca uma identidade nomeada.
      operationId: getAnalyticsTrustAdoption
      responses:
        '200':
          content:
            application/json:
              example:
                success: true
                data:
                  activeIdentities: 340
                  identitiesWithPassport: 340
                  passportAdoptionRate: 1
                  documentVerifiedShare: 0.61
                  levelDistribution:
                    - { level: UNVERIFIED, count: 40 }
                    - { level: BRONZE, count: 180 }
                    - { level: SILVER, count: 90 }
                    - { level: GOLD, count: 25 }
                    - { level: PLATINUM, count: 5 }
        '401': { description: Sem token ou token inválido/expirado (INVALID_TOKEN) }
        '403': { description: ADMIN_REQUIRED }

  /admin/analytics/cohorts:
    get:
      tags: [Analytics]
      summary: IP-020 — Retenção básica por coorte mensal de cadastro (ADMIN)
      operationId: getAnalyticsCohorts
      parameters:
        - { name: months, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 24, default: 6 }, description: Quantos meses de coorte incluir. }
      responses:
        '200':
          content:
            application/json:
              example:
                success: true
                data:
                  - { cohortMonth: '2026-07', cohortSize: 58, retainedMonth1: 21, retainedMonth2: 14, retentionRateMonth1: 0.3621, retentionRateMonth2: 0.2414 }
                  - { cohortMonth: '2026-08', cohortSize: 63, retainedMonth1: 18, retainedMonth2: 0, retentionRateMonth1: 0.2857, retentionRateMonth2: 0 }
        '401': { description: Sem token ou token inválido/expirado (INVALID_TOKEN) }
        '403': { description: ADMIN_REQUIRED }

  /admin/ledger/balances:
    get:
      tags: [Ledger]
      summary: IP-010 — Saldo por conta do ledger imutável (ADMIN)
      description: >
        Soma pura de `ledger_entries` por conta — prova o critério de aceite
        "relatórios financeiros derivam do ledger": nenhuma outra tabela é
        lida. Ver `apps/api/src/modules/payment/domain/entities/ledger-entry.ts`
        para a semântica de cada conta (convenção de conta de ATIVO: saldo
        positivo = valor atualmente retido/pago/devolvido).
      operationId: getLedgerBalances
      responses:
        '200':
          content:
            application/json:
              example:
                success: true
                data:
                  accounts:
                    - { account: MEMBER_FUNDING_CLEARING, balanceCents: -152000 }
                    - { account: CUSTODY_HELD, balanceCents: 42000 }
                    - { account: PARTNER_PAYABLE, balanceCents: 96000 }
                    - { account: REFUND_ISSUED, balanceCents: 14000 }
        '401': { description: Sem token ou token inválido/expirado (INVALID_TOKEN) }
        '403': { description: ADMIN_REQUIRED }

  /admin/ledger/reconcile/{paymentId}:
    get:
      tags: [Ledger]
      summary: IP-010 — Reconciliação domínio × ledger de um Payment (ADMIN)
      description: >
        Compara `Payment.refundableCents` (domínio) com o saldo derivado do
        próprio ledger para o mesmo Payment. Reconciliação domínio × PSP
        (webhook/transação real) NÃO está disponível: IP-009 permanece
        `BLOCKED_EXTERNAL` (sem credenciais Asaas reais) — ver
        `IP-010-COMPLETION-REPORT.md` §5.
      operationId: reconcileLedgerPayment
      parameters:
        - { name: paymentId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          content:
            application/json:
              example:
                success: true
                data:
                  paymentId: '019fe8f0-0000-7000-8000-000000000a01'
                  status: OK
                  domainRefundableCents: 15000
                  ledgerOutstandingCents: 15000
                  ledgerCustodyHeldCents: 15000
                  ledgerPartnerPayableCents: 0
                  ledgerRefundIssuedCents: 0
                  discrepancyCents: 0
        '401': { description: Sem token ou token inválido/expirado (INVALID_TOKEN) }
        '403': { description: ADMIN_REQUIRED }
        '404': { description: PAYMENT_NOT_FOUND }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token ES256, 15 min (IDN-003). Padrão em todas as rotas não públicas.

security:
  - bearerAuth: []
