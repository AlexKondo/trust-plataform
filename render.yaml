# Blueprint do Render para a API da Trust Platform.
# No Render: New + → Blueprint → conectar este repositório → ele lê este arquivo.
# As variáveis marcadas sync:false são preenchidas no painel (valores do seu .env).
#
# SUPERSEDED (2026-09-17): a conta Render usada para hospedar esta API foi
# suspensa por um problema de cobrança não relacionado ao código. O founder
# decidiu migrar o backend para Vercel Serverless Functions (ver
# apps/api/vercel.json, apps/api/api/index.ts e o Completion Report em
# docs/Multi-Agent Implementation Doc/IPS/MIGRATION-RENDER-TO-VERCEL-COMPLETION-REPORT.md).
# Este arquivo é mantido como referência/fallback caso o Render volte a ser
# usado no futuro — NÃO é o deploy ativo.
services:
  - type: web
    name: trust-api
    runtime: node
    plan: free
    # --prod=false: o build precisa das devDependencies (tsc) mesmo com NODE_ENV=production
    buildCommand: corepack enable && pnpm install --frozen-lockfile --prod=false && pnpm --filter @trust/api build
    startCommand: node apps/api/dist/shared/database/migrate.js && node apps/api/dist/main.js
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.16.0
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_DATABASE_URL
        sync: false
      - key: JWT_PRIVATE_KEY
        sync: false
      - key: JWT_PUBLIC_KEY
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: APP_BASE_URL
        sync: false
