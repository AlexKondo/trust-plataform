<!DOCTYPE html>

<html lang="pt-BR"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Login - Trust Platform</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "on-secondary-fixed": "#00201d",
                      "on-tertiary": "#ffffff",
                      "on-secondary": "#ffffff",

                      "secondary-container": "#86f2e4",
                      "on-tertiary-container": "#ffc9b7",
                      "on-background": "#131b2e",
                      "tertiary-fixed": "#ffdbcf",
                      "tertiary": "#7f2500",
                      "on-surface-variant": "#434655",
                      "surface-bright": "#faf8ff",
                      "inverse-on-surface": "#eef0ff",
                      "on-primary-fixed": "#001551",
                      "surface-container-lowest": "#ffffff",
                      "surface-container-low": "#f2f3ff",
                      "error": "#ba1a1a",
                      "surface-dim": "#d2d9f4",
                      "surface-tint": "#2151da",
                      "error-container": "#ffdad6",
                      "tertiary-fixed-dim": "#ffb59c",
                      "primary-container": "#1d4ed8",
                      "on-tertiary-fixed-variant": "#832700",
                      "on-error-container": "#93000a",
                      "on-primary-container": "#cad3ff",
                      "surface-container-highest": "#dae2fd",
                      "on-secondary-fixed-variant": "#005049",
                      "secondary": "#006a61",
                      "primary-fixed-dim": "#b7c4ff",
                      "inverse-primary": "#b7c4ff",
                      "on-primary": "#ffffff",
                      "surface-container-high": "#e2e7ff",
                      "inverse-surface": "#283044",
                      "secondary-fixed": "#89f5e7",
                      "secondary-fixed-dim": "#6bd8cb",
                      "on-secondary-container": "#006f66",
                      "outline": "#747686",
                      "tertiary-container": "#a73400",
                      "surface-variant": "#dae2fd",
                      "primary": "#0037b0",
                      "on-surface": "#131b2e",
                      "background": "#faf8ff",
                      "primary-fixed": "#dce1ff",
                      "outline-variant": "#c4c5d7",
                      "on-primary-fixed-variant": "#0039b5",
                      "surface-container": "#eaedff",
                      "surface": "#faf8ff",
                      "on-error": "#ffffff"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {
                      "section-padding": "2rem",
                      "stack-gap": "1.5rem",
                      "margin-mobile": "1.25rem",
                      "gutter": "1rem",
                      "container-max-width": "440px"
              },
              "fontFamily": {
                      "body-sm": [
                              "Inter"
                      ],
                      "body-lg": [
                              "Inter"
                      ],
                      "button": [
                              "Inter"
                      ],
                      "headline-md": [
                              "Inter"
                      ],
                      "label-bold": [

                      ],
                      "headline-lg": [

                      ]
              },
              "fontSize": {
                      "body-sm": [
                              "14px",

                                      "lineHeight": "20px",

                              }
                      ],
                      "headline-md": [

                      ],
                      "label-bold": [
                              "12px",
                              {
                                      "lineHeight": "16px",
                                      "letterSpacing": "0.05em",

                      ],
                      "headline-lg": [
                              "30px",
                              {
                                      "lineHeight": "38px",
                                      "letterSpacing": "-0.02em",
                                      "fontWeight": "700"

                      ]
              },
              "boxShadow": {
                  "ambient": "0px 10px 25px -5px rgba(15, 23, 42, 0.08)"
              }
            },
          }
        }
    </script>
<style>
        .spinner {
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }
        .material-symbols-outlined {
          font-variation-settings:
          'FILL' 0,
          'wght' 400,
          'GRAD' 0,
          'opsz' 24
        }
    </style>
</head>
<body class="bg-background text-on-surface min-h-screen flex items-center justify-center p-margin-mobile md:p-section-padding">
<main class="w-full max-w-container-max-width">
<div class="bg-surface-container-lowest rounded-xl shadow-ambient p-8 flex flex-col gap-8">
<!-- Branding -->
<div class="flex flex-col items-center gap-4 text-center">
<div class="w-12 h-12 bg-secondary/10 rounded-full flex items-center justify-center text-secondary">
<span class="material-symbols-outlined" data-icon="shield" style="font-size: 28px;">shield</span>
</div>
<h1 class="font-headline-lg text-headline-lg text-primary">Trust Platform</h1>
</div>
<!-- Header -->
<div class="text-center">
<h2 class="font-headline-md text-headline-md text-on-surface">Bem-vindo(a) de volta</h2>
<p class="font-body-lg text-body-lg text-on-surface-variant mt-2">Entre para acessar sua conta</p>
</div>
<!-- Error Banners (Demonstration) -->
<div class="flex flex-col gap-4 hidden" id="demo-banners">
<!-- Inline Error Banner -->
<div class="bg-error-container text-on-error-container p-4 rounded-lg flex items-start gap-3">
<span class="material-symbols-outlined mt-0.5" data-icon="error">error</span>
<p class="font-body-sm text-body-sm">E-mail ou senha inválidos.</p>
</div>
<!-- Warning Banner -->
<div class="bg-tertiary-container text-on-tertiary-container p-4 rounded-lg flex items-start gap-3">
<span class="material-symbols-outlined mt-0.5" data-icon="warning">warning</span>
<p class="font-body-sm text-body-sm">Conta bloqueada temporariamente por tentativas incorretas. Tente novamente em alguns minutos.</p>
</div>
</div>
<!-- Form -->
<form class="flex flex-col gap-stack-gap">
<div class="flex flex-col gap-2">
<label class="font-label-bold text-label-bold text-on-surface" for="email">E-mail</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-4 py-3 font-body-lg text-body-lg text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors" id="email" placeholder="seu@email.com" type="email"/>
</div>
<div class="flex flex-col gap-2">
<label class="font-label-bold text-label-bold text-on-surface" for="password">Senha</label>
<div class="relative">
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-4 py-3 font-body-lg text-body-lg text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors pr-12" id="password" placeholder="••••••••" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-on-surface transition-colors" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined" data-icon="visibility" id="visibility-icon">visibility</span>
</button>
</div>
<div class="flex justify-end mt-1">
<a class="font-body-sm text-body-sm text-primary hover:underline" href="#">Esqueci minha senha</a>
</div>
</div>
<div class="flex flex-col gap-4 mt-2">
<button class="w-full bg-primary-container text-on-primary rounded-lg py-3 px-4 font-button text-button hover:bg-primary transition-colors flex justify-center items-center gap-2" id="login-btn" onclick="simulateLogin()" type="button">
<span>Entrar</span>
</button>
<button class="w-full bg-surface-container-lowest border border-outline-variant text-on-surface rounded-lg py-3 px-4 font-button text-button hover:bg-surface-container-low transition-colors hidden justify-center items-center gap-2" disabled="" id="loading-btn" type="button">
<span class="material-symbols-outlined spinner" data-icon="progress_activity">progress_activity</span>
<span>Entrando...</span>
</button>
</div>
</form>
<!-- Footer -->
<div class="text-center mt-2">
<p class="font-body-sm text-body-sm text-on-surface-variant">
                    Não tem uma conta? <a class="text-primary font-semibold hover:underline" href="#">Criar conta</a>
</p>
</div>
</div>
<div class="mt-8 flex justify-center gap-4">
<button class="font-label-bold text-label-bold text-outline hover:text-primary transition-colors uppercase border border-outline-variant rounded px-2 py-1" onclick="toggleBanners()">Toggle Error Demo</button>
</div>
</main>
<script>
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const icon = document.getElementById('visibility-icon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                icon.textContent = 'visibility_off';
                icon.setAttribute('data-icon', 'visibility_off');
            } else {
                passwordInput.type = 'password';
                icon.textContent = 'visibility';
                icon.setAttribute('data-icon', 'visibility');
            }
        }

        function simulateLogin() {
            const loginBtn = document.getElementById('login-btn');
            const loadingBtn = document.getElementById('loading-btn');
            
            loginBtn.classList.add('hidden');
            loginBtn.classList.remove('flex');
            
            loadingBtn.classList.remove('hidden');
            loadingBtn.classList.add('flex');
            
            setTimeout(() => {
                loadingBtn.classList.add('hidden');
                loadingBtn.classList.remove('flex');
                
                loginBtn.classList.remove('hidden');
                loginBtn.classList.add('flex');
            }, 2000);
        }

        function toggleBanners() {
            const banners = document.getElementById('demo-banners');
            if (banners.classList.contains('hidden')) {
                banners.classList.remove('hidden');
                banners.classList.add('flex');
            } else {
                banners.classList.add('hidden');
                banners.classList.remove('flex');
            }
        }
    </script>
</body></html>
